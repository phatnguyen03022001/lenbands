  /v1/webhooks/billing/paddle:
    post:
      operationId: receivePaddleWebhook
      tags: [Webhooks]
      summary: Receive a signed billing lifecycle event at the adapter boundary.
      security: [{BillingWebhookSignature: []}]
      x-web-personas: []
      x-required-roles: [service]
      x-required-entitlements: []
      x-data-classes: [C1_account, C5_derived]
      x-idempotency: provider_event_id
      description: >-
        Verify the provider signature against the raw body, deduplicate by event_id,
        reason about occurred_at rather than arrival order, update only the
        provider-neutral billing/entitlement ledger, and reconcile missed events.
        Learning and assessment payloads are prohibited.
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/ObjectOK'}, '401': {$ref: '#/components/responses/Unauthorized'}}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Managed identity-provider JWT verified server-side.
    BillingWebhookSignature:
      type: apiKey
      in: header
      name: Paddle-Signature
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JsonObject'}
  responses:
    ObjectOK: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    ListOK: {description: Success, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}}}}
    ObjectCreated: {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    ObjectAccepted: {description: Accepted or processing, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    Unauthorized: {description: Authentication failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Role, entitlement or object authorization denied, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Resource not found or not visible to caller, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: State, version or idempotency conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unprocessable: {description: Semantically invalid input or insufficient evidence, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
      description: >-
        Domain-specific schemas are progressively tightened before implementation.
        This v0.1 authority first freezes operation identity, access, data class,
        idempotency and lifecycle ownership across all five web personas.
    Problem:
      type: object
      required: [type, title, status]
      additionalProperties: false
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        state: {type: string, enum: [action_required, processing, delayed, unavailable]}
        recoverable: {type: boolean}
        retry_after_seconds: {type: [integer, 'null'], minimum: 0}
