schema_version: 1.4.0
status: review
source_of_truth: true
contract_id: web-api-type-system
owner: engineering + security
purpose: closed type and transport-policy registry for schema-contract.yaml and deterministic OpenAPI resolution

primitive_types:
  string: {type: string}
  integer: {type: integer}
  number: {type: number}
  boolean: {type: boolean}

aliases:
  timestamp: {type: string, format: date-time}
  date: {type: string, format: date}
  semver: {type: string, pattern: '^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$'}
  iana_timezone:
    type: string
    minLength: 1
    maxLength: 64
    pattern: '^[A-Za-z_+-]+(?:/[A-Za-z0-9_+.-]+)+$'
    x-lenbands-rule: validate_against_runtime_iana_timezone_database_not_pattern_alone
  half_band_0_9: {type: number, minimum: 0, maximum: 9, multipleOf: 0.5}
  integer_5_480: {type: integer, minimum: 5, maximum: 480}
  official_ielts_score: {type: string, const: official_ielts_score}
  exam_simulation_estimate: {type: string, const: exam_simulation_estimate}
  diagnostic_estimate: {type: string, const: diagnostic_estimate}
  learning_mastery: {type: string, const: learning_mastery}
  placement: {type: string, const: placement}
  scalar_or_structured_answer:
    oneOf: [{type: string}, {type: number}, {type: boolean}, {type: array, items: {type: string}}, {type: object, additionalProperties: true}]
    x-lenbands-limit-profile: bounded_assessment_answer
  structured_content:
    type: object
    additionalProperties: true
    x-lenbands-data-class: C2_learning
    x-lenbands-limit-profile: bounded_structured_content
    x-lenbands-rendering: untrusted_structured_data
  governed_config_map:
    type: object
    propertyNames:
      not: {pattern: '(?i)(secret|token|password|credential|private[_-]?key|api[_-]?key)'}
    additionalProperties:
      oneOf: [{type: string}, {type: number}, {type: integer}, {type: boolean}, {type: 'null'}]
    x-lenbands-rule: web_admin_config_must_not_carry_secrets
    x-lenbands-limit-profile: bounded_governed_map
  governed_aggregate_map: {type: object, additionalProperties: {type: [string, number, integer, boolean, 'null']}}
  provider_neutral_usage_map: {type: object, additionalProperties: {type: [number, integer, string, 'null']}}
  aggregate_map: {type: object, additionalProperties: {type: [number, integer, string, 'null']}}
  provider_payload_normalized_after_signature_verification:
    type: object
    additionalProperties: true
    x-lenbands-trust-boundary: signature_verified_before_normalization
    x-lenbands-limit-profile: bounded_provider_payload
  provider_or_config: {type: string, enum: [provider, config]}

transport_policy:
  idempotency_key: {type: string, minLength: 16, maxLength: 128}
  webhook_signature_input: raw_request_body
  webhook_normalization_order: [verify_signature, deduplicate_event_id, parse_and_normalize, apply_provider_neutral_ledger_effect]
  request_limits:
    enforcement_order: [reject_transport_body_over_limit, parse_with_depth_and_collection_limits, validate_schema, apply_semantic_field_limits, reserve_expensive_work]
    max_json_body_bytes: 262144
    max_json_depth: 16
    max_object_properties: 256
    max_array_items: 1000
    semantic_profiles:
      learner_assessment_text: {max_characters: 30000, fields: [WritingDraftInput.text, WritingErrorFixInput.fix_text]}
      human_note: {max_characters: 4000, fields: [EvaluationFeedbackInput.note, ContentReportPatch.resolution_note, LifecycleTransitionInput.reason]}
      short_display_text: {max_characters: 512, fields: [ProfilePatch.display_name, TargetProfile.purpose]}
      bounded_assessment_answer: {max_serialized_bytes: 65536, max_depth: 8, max_array_items: 256, max_object_properties: 128}
      bounded_structured_content: {max_serialized_bytes: 262144, max_depth: 16, max_array_items: 1000, max_object_properties: 256}
      bounded_governed_map: {max_serialized_bytes: 65536, max_depth: 8, max_object_properties: 128}
      bounded_provider_payload: {max_serialized_bytes: 262144, max_depth: 16, max_array_items: 1000, max_object_properties: 256}
    rule: oversized_or_overdeep_input_is_rejected_before_storage_inference_logging_or_domain_side_effect
  browser_session:
    persistent_raw_bearer_storage_in_application_controlled_browser_storage: prohibited
    credentials_in_url_query_fragment_logs_analytics_or_cache_keys: prohibited
    cookie_authenticated_mutation_requires_origin_or_csrf_defense: true
    expired_or_revoked_session_reauthorizes_before_resume: true
    recent_auth_is_server_or_provider_verified_not_client_boolean: true
  browser_rendering:
    learner_colab_provider_and_generated_text_are_untrusted_data: true
    raw_html_rendering_default: prohibited
    markdown_or_rich_text_requires_allowlisted_renderer_and_sanitization: true
    executable_url_schemes: prohibited
    allowed_link_schemes: [https, http, mailto]
    javascript_data_vbscript_urls: prohibited
    dangerous_dom_sinks_without_reviewed_sanitizer: prohibited
    content_security_policy_required_for_release: true
    csp_unsafe_eval: prohibited
    csp_unsafe_inline_script_default: prohibited
    rule: sanitization_is_a_rendering_boundary_not_a_content_truth_or_authorization_mechanism
  public_failure_codes:
    - EVALUATION_DELAYED
    - EVALUATION_UNAVAILABLE
    - QUOTA_EXCEEDED
    - SYNC_CONFLICT
    - DRAFT_SYNC_UNAVAILABLE
    - SUBMISSION_UNAVAILABLE
    - CONTENT_UNAVAILABLE

result_validity_policy:
  values: [accepted, limited_evidence, insufficient_evidence, invalid, integrity_review]
  rule: result_validity_is_a_success_payload_domain_field_not_a_public_failure_code
  learner_uncertainty_rule: raw_model_confidence_is_not_exposed_as_correctness_probability_without_calibration

compiler_rules:
  - schema_names_resolve_before_aliases
  - array_angle_syntax_is_recursive
  - pipe_union_of_literals_becomes_enum
  - null_in_a_union_becomes_json_schema_null
  - every_single_token_type_must_be_a_primitive_alias_or_declared_schema
  - score_identity_singletons_are_closed_const_aliases
  - semantic_singletons_must_be_explicit_const_aliases
  - unknown_type_tokens_fail_ci
  - object_schemas_reject_unknown_properties_unless_the_alias_explicitly_allows_them
  - every_non_204_success_response_is_bound_to_the_operation_response_schema
  - resolved_openapi_is_the_only_codegen_input
  - canonical_openapi_operation_set_equals_schema_contract_operation_set_equals_operation_ownership_set
  - public_failure_codes_resolve_to_failure_taxonomy_public_projection
  - request_limit_profiles_are_security_contracts_even_when_a_field_uses_a_primitive_schema_token
  - untrusted_renderable_content_never_implies_html_trust
