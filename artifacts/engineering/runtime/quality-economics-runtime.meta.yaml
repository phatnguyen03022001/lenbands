family_id: OPS.QualityEconomics
family_version: 1.0.0
build_status: candidate
decision_units:
  - unit_id: quality.model_route_selection
    capability_ids: [OPS.ModelRouting]
    purpose: select only a policy-approved provider-neutral route from eligible routes
  - unit_id: quality.quota_decision
    capability_ids: [OPS.Quota]
    purpose: apply deterministic quota reservation charge release and denial rules
  - unit_id: quality.cost_aggregation
    capability_ids: [OPS.CostBudget, OPS.Observability]
    purpose: aggregate measured provider-neutral usage and cost facts
  - unit_id: quality.benchmark_metrics
    capability_ids: [OPS.EvaluationQuality, OPS.OutcomeMeasurement]
    purpose: compute benchmark and outcome metrics from immutable evidence records
  - unit_id: quality.confidence_state_derivation
    capability_ids: [GOVERNANCE.ConfidenceScore]
    purpose: derive governed confidence state from validated inference evidence and active policy
  - unit_id: quality.release_gate_decision
    capability_ids: [OPS.ReleaseGate, OPS.ContentQuality, OPS.EvaluationQuality]
    purpose: approve block or roll back only from validated evidence and armed policy thresholds
  - unit_id: quality.audit_record
    capability_ids: [GOVERNANCE.AuditTrail]
    purpose: record immutable decision provenance without changing the underlying decision
change_log:
  - version: 0.2.0
    date: 2026-08-17
    changes:
      - Added stable decision units for routing, quota, cost, benchmark, confidence-state, release-gate and audit computation.
      - Kept route selection and release decisions deterministic even when routed workloads use probabilistic inference.
  - version: 0.1.1
    date: 2026-08-10
    changes:
      - Added Executor Dossier dimensions (permission, data read/write, API, events, UI states, observability, rollback, adapter boundary, non-goals, deferred)
      - Annotated drift/anti-gaming as P1 unresolved_gap; anti_gaming_flagged removed from P0 published scope
      - Convergence audit M10/M11 + Executor Dossier campaign resolution
