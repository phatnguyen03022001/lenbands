schema_version: 1.2.0
status: review
source_of_truth: true
contract_id: platform-runtime
owner: engineering + operations
purpose: provider-neutral runtime invariants for all implementation slices

principles:
  - domain_semantics_are_provider_neutral
  - managed_capabilities_are_preferred_over_custom_infrastructure
  - execution_mechanisms_are_replaceable_adapters_not_product_authority
  - deterministic_mechanisms_are_preferred_when_they_meet_required_quality
  - model_or_speech_output_is_candidate_observation_or_judgment_until_domain_validation
  - durable_domain_effects_are_idempotent
  - raw_learner_content_is_never_general_telemetry
  - unmeasured_optimizations_are_disabled_by_default
  - absolute_time_and_local_calendar_semantics_are_not_interchangeable

execution_modes:
  request_response:
    use_when: completion_fits_within_the_http_budget_and_no_durable_background_continuation_is_required
    requirements: [authorization, input_validation, idempotency_for_mutations, bounded_deadline, typed_failure]
  durable_operation:
    use_when: work_must_survive_request_lifetime_or_provider_latency
    canonical_state_machine: [accepted, processing, succeeded, delayed, unavailable, failed, cancelled]
    requirements:
      - durable_operation_record
      - stable_idempotency_key
      - absolute_deadline
      - bounded_provider_attempts
      - commit_domain_effect_before_completion_acknowledgement
      - reconciliation_from_canonical_state
      - no_raw_content_in_transport_metadata
    implementation_note: provider_managed_workflow_queue_or_equivalent_is_an_adapter_choice

result_validity:
  applies_to: [evaluation, placement_estimate, readiness_evidence, other_high_risk_derived_results]
  states: [accepted, limited_evidence, insufficient_evidence, invalid, integrity_review]
  rule: processing_or_transport_state_must_not_be_overloaded_with_result_trustworthiness
  evidence_rule: only_states_explicitly_admitted_by_the_owning_domain_policy_may_update_readiness_or_mastery

persistence:
  canonical_relational_state:
    requirement: managed_transactional_relational_store
    owns: [domain_state, idempotency_records, operation_state, audit_references]
  object_content:
    requirement: private_managed_object_storage_when_binary_or_large_content_is_needed
    rule: access_is_subject_scoped_and_raw_content_is_not_copied_into_general_events_or_logs
  cache:
    default_state: disabled
    enable_only_if: measured_latency_or_cost_evidence_and_a_documented_invalidation_model_exist
    invariant: cache_outage_may_change_latency_but_not_authorization_entitlement_score_or_durability
  search_or_vector_index:
    default_state: disabled
    enable_only_if: measured_retrieval_requirement_cannot_be_met_by_primary_store_or_managed_search

schema_change:
  canonical_contract: artifacts/engineering/data-migration-contract.yaml
  rule: schema_backfill_or_projection_changes_follow_the_data_migration_contract_and_may_not_be_inferred_from_orm_diff_alone

async_handoff:
  semantic_owner: durable_operation
  required_fields: [operation_id, operation_type, idempotency_key_hash, subject_ref, payload_ref, privacy_class, deadline_at, created_at, state, internal_function_scope]
  forbidden_fields: [raw_essay, raw_audio, transcript, prompt_body, provider_payload, access_token, secret]
  delivery_semantics: at_least_once_transport_with_exactly_once_domain_effect_by_idempotency
  retry_owner: one_layer_only
  replay_rule: replay_creates_a_new_audited_operation_and_never_mutates_a_terminal_result

internal_principals:
  rule: one_generic_service_identity_never_implies_blanket_domain_authorization
  required_function_scopes:
    - evaluation_worker
    - workflow_callback
    - billing_webhook
    - content_job
    - notification_job
    - research_benchmark_job
  authorization:
    - resolve_function_scope_before_data_access
    - enforce_minimum_object_and_data_class_scope
    - model_or_provider_credentials_do_not_grant_lenbands_permissions
    - server_side_elevated_database_access_reapplies_product_and_function_authorization

intelligence_boundary:
  deterministic_first:
    examples:
      - auth_authorization_entitlement
      - objective_answer_scoring_and_normalization
      - score_scope_and_band_arithmetic
      - fsrs_scheduling
      - item_exposure_and_evidence_admission
      - p0_next_best_action_rules
      - notification_limits
      - schema_publish_and_rights_gates
      - analytics_and_cost_aggregation
  inference_allowed_when:
    - semantic_or_rubric_judgment_cannot_meet_required_quality_deterministically
    - open_ended_language_generation_is_material_to_outcome
    - speech_transcription_or_acoustic_analysis_is_required
  routing_order:
    - deterministic_rule_library_or_sql
    - versioned_precomputed_or_reusable_result
    - bounded_small_or_specialist_model
    - benchmark_approved_stronger_or_specialist_route
    - safe_degraded_state_or_durable_retry
  prohibited:
    - llm_directly_authorizes_access_or_entitlement
    - llm_directly_publishes_content
    - llm_raw_output_directly_declares_readiness_or_mastery
    - unbounded_learner_history_sent_when_compact_relevant_snapshot_is_sufficient

provider_boundary:
  adapter_contract: artifacts/engineering/contracts/runtime/provider-adapter-contract.md
  allowed_provider_change: configuration_or_adapter_change_with_no_domain_or_api_semantic_change
  learner_visible_scoring_fallback: only_between_benchmark_approved_routes_within_the_same_scorer_route_version
  no_approved_scoring_route: delayed_or_unavailable_not_silent_substitution
  minimum_context_rule: send_only_operation_required_payload_plus_bounded_relevant_learner_state

time_semantics:
  absolute_instant:
    storage: UTC_timestamp
    applies_to: [created_at, updated_at, due_at, deadline_at, evaluated_at, provider_event_occurred_at, audit_time]
    rule: compare_absolute_instants_in_UTC_not_server_local_time
  local_calendar:
    timezone_identifier: IANA_timezone_id
    applies_to: [today_plan_day, quiet_hours, local_day_summary, exam_countdown_display]
    rule: local_calendar_logic_uses_the_learner_timezone_effective_for_that_decision
  date_only:
    examples: [target_exam_date]
    rule: a_date_only_value_is_not_coerced_to_midnight_UTC
  timezone_change:
    rule: changing_timezone_never_rewrites_historical_absolute_instants
    daily_plan: invalidate_or_replace_future_local_day_projection_without_duplicate_completion
    review_due: preserve_absolute_due_instant_unless_the_review_policy_explicitly_reschedules
  DST:
    rule: use_timezone_database_rules_not_fixed_offsets_for_local_calendar_behavior
  agent_rule: if_the_product_has_no_persisted_timezone_source_for_a_local_calendar_feature_report_a_schema_gap_instead_of_using_server_timezone

reproducibility:
  levels: [exact, semantic, audit_only]
  exact: same_immutable_inputs_rubric_prompt_route_and_executable_model_provider_version_remain_available
  semantic: exact_provider_or_model_is_unavailable_but_a_governed_route_can_rerun_the_same_task_rubric_and_score_scope_semantics
  audit_only: historical_result_is_attributable_to_immutable_inputs_and_version_identities_but_faithful_rerun_is_not_available
  required_audit_identity: [task_version, rubric_version, prompt_hash, scorer_route_version, model_id, provider_id, assessment_mode]
  rule: provider_or_model_retirement_never_rewrites_a_historical_result
  reevaluation_rule: governed_reevaluation_creates_a_new_result_with_prior_result_reference_and_its_own_route_provenance

configuration:
  activated_values_source: artifacts/engineering/contracts/runtime/runtime-baseline-config.yaml
  rule: candidate_values_are_not_runtime_defaults_until_explicitly_armed

non_authoritative_mechanisms:
  - redis_streams
  - kafka
  - custom_worker_fleet
  - go_api
  - python_request_service
  - custom_cache_cluster
  - custom_workflow_engine
  - model_provider
  - prompt
  - agent

acceptance_invariants:
  - duplicate_delivery_produces_at_most_one_domain_effect_and_one_charge
  - crash_or_retry_converges_from_canonical_state_without_raw_content_in_logs
  - provider_outage_preserves_submissions_and_exposes_a_safe_delayed_or_unavailable_state
  - cache_disabled_or_flushed_does_not_change_product_semantics
  - provider_swap_does_not_require_domain_event_or_http_semantic_migration
  - every_runtime_value_used_for_release_is_armed_and_has_an_approval_or_evidence_reference
  - internal_function_a_cannot_perform_internal_function_b_domain_operation_by_credential_reuse_alone
  - model_output_cannot_change_readiness_without_domain_evidence_admission
  - cheaper_routing_cannot_bypass_the_required_evaluation_quality_floor
  - timezone_change_cannot_duplicate_or_erase_completed_daily_actions_or_review_effects
  - historical_evaluation_remains_attributable_after_route_or_provider_retirement
