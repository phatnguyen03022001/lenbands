execution_algorithm:
  mode: "artifact_normative_algorithm"
  algorithm_id: "lenbands-r223-artifact-normative-replay"
  algorithm_version: "2.2.3"
  normative_steps:
    - "load frozen source entries in relative path order"
    - "slice founder rows by declared UTF-8 byte ranges"
    - "derive one case-sensitive seed from each founder row display cell"
    - "scan every frozen source line in path and line order"
    - "emit causal hit for each exact seed occurrence"
    - "extract markdown link destinations and qualifying backtick repository paths"
    - "normalize fragment, query, absolute prefix, source-relative path, and dot segments"
    - "classify every candidate under the finite resolution taxonomy"
    - "emit traversal node for each resolved file"
    - "emit leaf for a hit without candidates and one terminal per candidate"
    - "apply blocking to missing, directory, malformed, inaccessible, and ambiguous classes"
    - "apply nonblocking external effect only under frozen rule and row facts"
    - "sort identity sets and hash them"
  input_schema:
    - "source_snapshot_hash"
    - "founder_row_inputs"
    - "seed_derivations"
    - "search_contract_hash"
  output_schema:
    - "search_hits"
    - "raw_reference_candidates"
    - "traversal_nodes"
    - "terminal_branches"
    - "execution_ledger"
    - "exception_witnesses"
  detector_rules:
    - "exact_seed_substring_v1"
    - "markdown_link_destination_v1"
    - "backtick_repository_path_v1"
  tokenizer_rules:
    - "UTF-8 decode"
    - "LF line split"
    - "preserve byte offsets"
  lexical_normalization_rules:
    - "case-sensitive"
    - "Unicode scalar equality"
    - "no whitespace folding"
  path_normalization_rules:
    - "strip fragment"
    - "strip query"
    - "strip repository absolute prefix"
    - "resolve dot segments"
    - "resolve source-directory relative path"
  reference_extraction_rules:
    - "markdown link destination is candidate"
    - "backtick value needs slash and recognized file suffix or repository prefix"
  directory_resolution_rules:
    - "existing directory under include root is resolved_in_universe_directory and is not expanded"
  classification_rules:
    - "existing included file"
    - "existing included directory"
    - "missing included target"
    - "outside include roots"
    - "empty or invalid value"
    - "ambiguous glob or brace value"
    - "unreadable existing target"
    - "multiple normalized targets"
  queue_ordering_rules:
    - "path ascending byte order"
    - "line ascending integer order"
    - "candidate ascending UTF-8 byte order"
  visited_identity_rules:
    - "normalized path plus parent observation identity"
  cycle_rules:
    - "visited path emits cycle_revisit and is not enqueued"
  terminal_rules:
    - "leaf nonblocking"
    - "resolved file leaf nonblocking"
    - "missing included target blocking"
    - "directory blocking without expansion rule"
    - "malformed inaccessible ambiguous blocking"
    - "external nonblocking only under R223-TERM-NONBLOCK-EXTERNAL"
  irrelevance_rules:
    - "external target outside both include roots"
    - "row, profile, seed, parent, source location, and normalized reference required"
  observation_identity_rules:
    - "exclude timestamps temp paths memory addresses report formatting"
  digest_rules:
    - "canonical_json_sha256_v1"
    - "newline-terminated lexicographic identity set sha256"
