# Learning Ontology Capability Mapping Inventory
# Non-authoritative, non-protected draft inventory. 2026-08-11.
# NOT a canonical registry or generated projection. Review inventory only.
# Capability IDs, lifecycles, and phases are exact copies from the SSOT
# artifacts/operations/capability-lifecycle-registry.yaml v1.0.0.
# mapping_status is projection-local: mapped|partial|unknown_ontology_mapping|not_applicable.
# It is not domain vocabulary and never flows into runtime.

schema_version: 0.2.3
status: draft
source: artifacts/operations/capability-lifecycle-registry.yaml
derived_from: artifacts/engineering/decisions/learning-ontology-adoption-readiness.md

mapping_status_definition:
  mapped: the declared primary ontology concept and relation are fully evidenced for this inventory scope
  partial: one or more declared dimensions are evidenced while explicitly named dimensions remain missing
  unknown_ontology_mapping: no contract evidence to determine primary ontology concept
  not_applicable: genuinely platform/cross-cutting and outside the 8 ontology objects; explanation in rationale

# For every mapped or partial row, evidence_refs must contain exact repository
# path:line references; mapped_dimensions and missing_dimensions are projection-
# local audit fields. Their labels are not domain vocabulary or lifecycle states.
# mapped rows require missing_dimensions: []; partial rows require at least one
# explicit missing_dimensions label.

# The 8 ontology concepts: skill, knowledge, task_type, practice, content, assessment, evidence, mastery.
# study, review, history, progress_personal, governance, ops, and orchestration are NOT ontology concepts.

