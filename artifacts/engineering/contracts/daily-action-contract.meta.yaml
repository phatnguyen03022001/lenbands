type: daily-action-contract
status: review
version: 0.3.0
owner: engineering
representation: markdown
derived_from:
  - STUDY.DailyPlan
  - STUDY.CheckIn
  - STUDY.MicroSession
  - PERSONAL.NextBestAction
  - OPS.Observability
purpose: p0-daily-action-runtime-contract
created_at: 2026-08-07
updated_at: 2026-08-17
decision_units:
  - unit_id: daily_action.evidence_assembly
    capability_ids: [STUDY.DailyPlan, PERSONAL.NextBestAction]
    purpose: assemble versioned learner-owned facts eligible for plan computation
  - unit_id: daily_action.weakness_eligibility
    capability_ids: [PERSONAL.NextBestAction]
    purpose: determine whether independent evidence supports weakness routing
  - unit_id: daily_action.priority_ranking
    capability_ids: [STUDY.DailyPlan, PERSONAL.NextBestAction]
    purpose: rank eligible actions under coverage overload continuity and goal constraints
  - unit_id: daily_action.action_selection
    capability_ids: [STUDY.DailyPlan, PERSONAL.NextBestAction]
    purpose: choose the bounded next action set from ranked eligible actions
  - unit_id: daily_action.reason_fact
    capability_ids: [STUDY.DailyPlan, PERSONAL.NextBestAction]
    purpose: produce controlled reason codes and supporting references for the selected action
  - unit_id: daily_action.presentation_wording
    capability_ids: [STUDY.DailyPlan]
    purpose: render learner-facing wording without changing selected action facts or reason codes
change_log:
  - version: 0.3.0
    date: 2026-08-17
    changes:
      - Added stable decision-unit identities so compute policy can project exact bindings without owning Daily Action semantics.
      - Preserved P0 deterministic routing and separated authoritative reason facts from presentation wording.
  - version: 0.2.0
    date: 2026-08-17
    changes:
      - Added independent-evidence guard for weakness routing so duplicate/revealed-item attempts cannot create a false weakness signal.
      - Added deterministic coverage/anti-tunnel-vision constraints while preserving P0 max_llm_calls=0.
      - Separated activity completion from durable mastery and introduced the practice -> retest -> transfer -> maintenance boundary.
  - version: 0.1.3
    date: 2026-08-11
    changes:
      - Terminology integrity correction: relabeled the section heading from "Canonical API surface" to "Selected logical API surface (OpenAPI candidate)"; stated writing-task-2/openapi.yaml is the selected logical candidate surface for the P0 loop and contracts/openapi.yaml is the selected logical identity surface; explicitly noted no unified canonical OpenAPI authority exists and neither live spec is a complete build input; replaced "documented implementation-blocked conflict, not a second canonical authority" with "identified/triaged, unresolved, implementation-blocked conflict; it does not create a second canonical authority"; removed the phrase "the canonical OpenAPI" in the CheckIn conflict. No endpoint, schema, state, conflict fact, owner, or readiness claim changed.
  - version: 0.1.2
    date: 2026-08-11
    changes:
      - Added canonical OpenAPI surface section with exact path references. Documented three conflicts: (1) STUDY.CheckIn has no dedicated endpoint; (2) session path-format and completion-method mismatch; (3) DailyPlan plan_replaced lifecycle state absent from OpenAPI. Did not invent endpoints, schemas, or owners.
  - version: 0.1.1
    date: 2026-08-10
    changes:
      - Defined reason_code controlled enum with 7 P0 deterministic values (placement_recent, review_due, weakness_practice, goal_aligned, continue_session, daily_goal_remaining, fallback_micro_session)
      - Added unknown_reason_code fallback; convergence audit M7 resolution
