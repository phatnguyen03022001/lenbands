type: data-contract
status: review
version: 0.3.0
owner: engineering
representation: markdown
derived_from: [REVIEW.MistakeNotebook, REVIEW.FSRS, REVIEW.SmartQueue, COACH.ErrorAnalysis, EVAL.Writing, PRACTICE.Drill]
purpose: runtime-data-ownership-error-review-loop
created_at: 2026-08-07
updated_at: 2026-08-17
decision_units:
  - unit_id: review.error_eligibility
    capability_ids: [REVIEW.MistakeNotebook, COACH.ErrorAnalysis]
    purpose: decide whether an accepted evidence-backed finding may become a learning error
  - unit_id: review.card_creation
    capability_ids: [REVIEW.MistakeNotebook, REVIEW.FSRS]
    purpose: create a review card only from eligible canonical learning-error facts
  - unit_id: review.fsrs_transition
    capability_ids: [REVIEW.FSRS]
    purpose: compute the next FSRS state and due interval from the rating and prior card state
  - unit_id: review.queue_priority
    capability_ids: [REVIEW.SmartQueue]
    purpose: rank due and eligible review items under deterministic queue policy
  - unit_id: review.retest_resolution
    capability_ids: [PRACTICE.Drill, REVIEW.MistakeNotebook]
    purpose: resolve retest outcome and learning-error state from canonical attempt evidence
