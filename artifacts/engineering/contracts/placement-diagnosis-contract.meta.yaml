type: placement-diagnosis-contract
status: review
version: 0.3.0
owner: engineering
representation: markdown
derived_from:
  - GOAL.Target
  - PLACE.Test
  - PLACE.BandEstimation
  - PLACE.GapDetection
  - PLACE.InitialPath
  - PLACE.SkillDiagnosis
  - BAND.Current
  - OPS.ReleaseGate
purpose: p0-diagnosis-runtime-contract
created_at: 2026-08-07
updated_at: 2026-08-17
decision_units:
  - unit_id: placement.item_selection
    capability_ids: [PLACE.Test]
    purpose: select the next P0 placement item from the published deterministic blueprint
  - unit_id: placement.response_fact_scoring
    capability_ids: [PLACE.Test, PLACE.SkillDiagnosis]
    purpose: normalize and score objective response facts under the published placement configuration
  - unit_id: placement.termination
    capability_ids: [PLACE.Test]
    purpose: apply coverage burden and evidence stopping rules
  - unit_id: placement.band_estimate
    capability_ids: [PLACE.BandEstimation, BAND.Current]
    purpose: derive the bounded provisional diagnostic estimate from valid placement evidence
  - unit_id: placement.gap_derivation
    capability_ids: [PLACE.GapDetection]
    purpose: derive explicit gaps from persisted estimate evidence and target requirements
  - unit_id: placement.initial_path_selection
    capability_ids: [PLACE.InitialPath]
    purpose: select an initial path from persisted goal gap and valid configuration facts
change_log:
  - version: 0.3.0
    date: 2026-08-17
    changes:
      - Added stable decision-unit identities for deterministic P0 placement computation.
      - Kept future adaptive/statistical placement outside P0 until calibration evidence supports a compute-mode change.
  - version: 0.2.0
    date: 2026-08-17
    changes:
      - Added explicit diagnostic score scope, evidence coverage, skill-level estimate slots, confidence state, and placement termination reason.
      - Added fail-closed rules for insufficient evidence, missing coverage, repeated/revealed item exposure, and max-burden termination.
      - Defined the future adaptive-placement boundary: content balancing, information/item-selection policy, exposure control, stopping rule, burden, and calibration provenance; P0 remains fixed/deterministic until calibrated.
  - version: 0.1.3
    date: 2026-08-11
    changes:
      - Terminology integrity correction: relabeled the section heading from "Canonical API surface" to "Selected logical API surface (OpenAPI candidate)"; stated writing-task-2/openapi.yaml is the selected logical candidate surface for the P0 loop and contracts/openapi.yaml is the selected logical identity surface; explicitly noted no unified canonical OpenAPI authority exists and neither live spec is a complete build input; replaced "resolved-but-implementation-blocked" with "identified/triaged, unresolved, implementation-blocked". No endpoint, schema, state, conflict fact, owner, or readiness claim changed.
  - version: 0.1.2
    date: 2026-08-11
    changes:
      - Added canonical OpenAPI surface section with exact path references to writing-task-2/openapi.yaml. Documented the path-method mismatch between contract API table and OpenAPI as a resolved-but-implementation-blocked conflict, not a second authority.
