      - Added deterministic TargetFeasibility planning states without exam-success probability semantics.
      - Added evidence-bound diagnosis causes: english_foundation, ielts_technique, integrated_performance, mixed, evidence_needed.
      - Compressed InitialPath to one priority, one action, one verification rule and at most one lighter alternative.
      - Added content_gap and no-over-band routing boundaries.
      - Explicitly prohibited guaranteed official-band attainment claims without separate outcome evidence.
  - version: 0.3.0
    date: 2026-08-20
    changes:
      - Replaced legacy confidence-state semantics with domain-owned result_validity.
      - Bound PlacementResult to configuration/policy/calibration provenance and evidence coverage.
      - Separated implementation eligibility from post-implementation calibration/release evidence.
      - Removed split-OpenAPI migration guidance.
  - version: 0.2.0
