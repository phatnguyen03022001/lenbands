# Transport Classification — Machine-Readable
# Derived from: capability-lifecycle-registry.yaml (canonical 180 IDs)
# Generated: 2026-08-10
# Status: review
# Arithmetic: 33 active + 146 planned + 1 deprecated = 180 (verified against lifecycle registry snapshot)
# Transport classes: public-http, auth-bff, internal-command, async-job, event-projection, deferred-no-runtime

classes:
  public-http:
    definition: "Learner-facing HTTP endpoint served by Go API. Bearer token required. Listed in canonical OpenAPI."
  auth-bff:
    definition: "BFF-mediated HTTP endpoint. Next.js → Go API with BFF service key or pre-validated provider token. Not direct learner browser."
  internal-command:
    definition: "Go service command triggered by job completion, event, or internal workflow. No HTTP surface."
  async-job:
    definition: "Durable job queued via Redis Streams or Postgres outbox, claimed by Python/Go worker. Status polled via HTTP. HTTP trigger may exist."
  event-projection:
    definition: "Derived state computed from canonical event stream. No direct API. Read via parent entity HTTP endpoint."
  deferred-no-runtime:
    definition: "No runtime contract exists. Transport TBD at family promotion. Phase listed."

