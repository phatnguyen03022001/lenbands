# Enumeration verification
# Lifecycle status and transport class are INDEPENDENT axes.
# Lifecycle: 33 ACTIVE + 146 PLANNED + 1 DEPRECATED = 180
# Transport classes sum to 180 with NO deprecated_count added to class totals.
verification:
  total_entries: 180
  lifecycle:
    active_count: 33
    planned_count: 146
    deprecated_count: 1
    arithmetic: "33 + 146 + 1 = 180"
  class_counts:
    public-http: 14
    auth-bff: 2
    internal-command: 11
    async-job: 1
    event-projection: 4
    deferred-no-runtime: 148
    arithmetic: "14 + 2 + 11 + 1 + 4 + 148 = 180"
    note: "deferred-no-runtime includes 146 PLANNED + 1 DEPRECATED (EVAL.AntiGaming) + 1 ACTIVE (OPS.ContentQuality). The 1 ACTIVE with deferred-no-runtime has an explicit deferred_reason field."
