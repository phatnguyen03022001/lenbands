contract: runtime-baseline-configuration
version: 0.2.0
status: draft
scope: closed_pilot_p0
owner: engineering
activated: false
activation_rule: >-
  Values under candidate_values are design hypotheses only. They become runtime
  configuration only through an approved evidence/procurement decision bound to a
  candidate release. Missing values fail closed; no provider or custom mechanism is implied.

invariants:
  idempotency_required_for_durable_mutations: true
  provider_attempts_are_bounded: true
  unbenchmarked_scoring_fallback_allowed: false
  raw_content_telemetry_tolerance: 0
  cache_default_state: disabled
  dedicated_queue_or_worker_default_state: disabled

candidate_values:
  http:
    request_id_header: X-Request-Id
    idempotency_retention_hours: 48
  quota:
    timezone: UTC
    reservation_required_before_costly_action: true
    windows:
      free:
        writing_evaluation_daily: 3
        writing_evaluation_weekly: 10
        retest_daily: 3
      premium:
        writing_evaluation_daily: 50
        writing_evaluation_weekly: null
        retest_daily: 50
  durable_operation:
    absolute_deadline_seconds: 300
    max_provider_attempts: 2
    per_subject_in_flight_evaluations: 1
    global_evaluation_concurrency: 4
    reconciliation_interval_minutes: 15
  provider_adapter:
    per_attempt_timeout_seconds: 75
    circuit_breaker:
      consecutive_transient_failures_to_open: 5
      open_seconds: 120
      half_open_probe_count: 1
  llm:
    writing_evaluation:
      target_input_tokens: 4000
      target_output_tokens: 1500
      hard_max_input_tokens: 6000
      hard_max_output_tokens: 2000
      prompt_template_id: writing_evaluation_v1
      require_structured_evaluation_contract: true
      allow_unbenchmarked_fallback: false
  observability:
    evaluation_start_p95_seconds: 60
    evaluation_terminal_p95_seconds: 300
    sustained_slo_breach_minutes: 15
    raw_content_telemetry_tolerance: 0

activation_requirements:
  - provider_composition_selected
  - privacy_and_dpa_reviewed
  - numeric_cost_policy_approved
  - scoring_route_benchmarked_when_learner_visible
  - restore_and_recovery_design_reviewed
  - candidate_release_sha_recorded

removed_as_architecture_defaults:
  - redis_stream_names
  - redis_consumer_groups
  - dlq_streams
  - custom_outbox_polling
  - custom_worker_leases
  - cache_ttls
