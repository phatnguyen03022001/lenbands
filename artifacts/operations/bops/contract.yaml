type: bops-contract
status: review
version: 1.3.0
owner: operations + engineering + security
representation: yaml
derived_from: [OPS.ReleaseGate, OPS.Observability, ADMIN.GovernanceDashboard, IDENTITY.Privacy, CONTENT.Publish, SUB.Payment]
purpose: machine-readable Business/Operations/Platform/Security control plane for the buy-first web platform
created_at: 2026-08-17
updated_at: 2026-08-20

scope:
  web_personas: [guest, learner, premium_learner, colab, admin]
  authorization_roles: [learner, colab, admin]
  non_web_function_scopes: [evaluation_worker, workflow_callback, billing_webhook, content_job, notification_job, research_benchmark_job]
  environments: [local, preview, production]

operating_domains:
  account_identity:
    owner: operations + engineering
    required_controls: [identity_provider_health, account_status_audit, consent_versioning, auth_abuse_rate_limits]
  learner_data_privacy:
    owner: operations + security
    required_controls: [export_queue, deletion_queue, legal_hold_exception_policy, retention_registry, request_audit]
  billing_entitlements:
    owner: business + operations
    required_controls: [webhook_health, entitlement_reconciliation, refund_or_dispute_visibility, provider_incident_playbook]
  content_operations:
    owner: colab + operations
    required_controls: [author_review_publish_permissions, review_queue, publish_gate, retirement_without_history_deletion, rights_provenance_check, learner_report_triage]
  evaluation_quality:
    owner: engineering + governance
    required_controls: [benchmark_route_gate, staged_evidence_pipeline, result_validity_policy, uncertainty_quality_monitoring, drift_slices, scorer_route_rollback, immutable_provenance]
  release_change:
    owner: engineering + operations
    required_controls: [change_set, same_head_verification, protected_attestation, rollback_or_disable_path, post_release_observation]
  provider_procurement:
    owner: founder + operations
    required_controls: [DPA_terms_region_review, cost_budget, data_class_allowance, exit_export, credential_scope, incident_contact]
  incident_support:
    owner: operations
    required_controls: [severity_classification, incident_classification, learner_impact_assessment, single_incident_owner, communication_decision, recovery_verification, post_incident_action]

runbook_contract:
  rule: each activated operating domain/provider has one short executable runbook before public release
  required_fields: [owner, trigger, diagnosis, safe_action, rollback_or_recovery, learner_communication_rule, evidence_to_close]
  prohibited: [runbook_that_requires_raw_secret_in_document, manual_score_overwrite, untracked_database_mutation]

data_classes:
  C0_public:
    examples: [published_content_metadata, public_config, public_pricing]
    raw_analytics_allowed: true
  C1_account:
    examples: [email, billing_subject_mapping, consent]
    raw_analytics_allowed: false
  C2_learning:
    examples: [goal, review_state, learning_path, private_notes]
    raw_analytics_allowed: false
  C3_assessment:
    examples: [essay, answer, audio, transcript, score_evidence]
    raw_analytics_allowed: false
  C4_security:
    examples: [secrets, signing_keys, security_config, release_internals]
    raw_analytics_allowed: false
  C5_derived:
    examples: [opaque_ids, event_name, latency, aggregate_quality_metric, aggregate_cost_metric]
    raw_analytics_allowed: true

platform_planes:
  web_runtime:
    candidate: Vercel
    status: selected_for_design_not_provisioned
    capabilities: [Next.js_hosting, Functions, Workflow, AI_Gateway, platform_observability]
    allowed_data: [C0_public, C1_account, C2_learning, C3_assessment, C5_derived]
    prohibited_persistence: [raw_C3_in_general_logs, secrets_in_source_or_output, full_provider_response_in_telemetry]
    controls:
      - same_origin_API_boundary
      - server_only_secrets
      - function_and_workflow_input_minimization
      - internal_function_scope_before_elevated_data_access
      - idempotent_durable_steps
      - deterministic_first_execution_policy
      - scoring_route_model_provider_allow_list
      - cost_budgets_and_timeout
    exit: Next.js/HTTP contract plus Postgres SSOT; workflow state never becomes domain SSOT
  data_identity:
    candidate: Supabase
    status: selected_for_design_not_provisioned
    capabilities: [Postgres, Auth, Storage, RLS_RBAC, Realtime]
    allowed_data: [C0_public, C1_account, C2_learning, C3_assessment, C5_derived]
    controls:
      - RLS_on_exposed_schemas
      - service_or_bypass_RLS_credentials_server_only
      - application_and_function_scope_authorization_before_elevated_queries
      - opaque_object_paths_and_storage_policies
      - standard_Postgres_migrations_and_export
    exit: Postgres dump/migrations plus storage export plus external-subject mapping
  transactional_email:
    candidate: Resend_or_managed_SMTP
    status: candidate
    allowed_data: [C1_account]
    prohibited_data: [C2_learning, C3_assessment, C4_security]
    controls: [template_ids_not_sensitive_payloads, frequency_caps, provider_adapter, delivery_reconciliation]
  billing:
    candidate: Paddle
    status: candidate_not_activated
    allowed_data: [C1_account, C5_derived]
    prohibited_data: [C2_learning, C3_assessment, C4_security]
    controls:
      - signed_raw_body_webhook_verification
      - deduplicate_by_event_id
      - reason_by_occurred_at_not_arrival_order
      - provider_neutral_entitlement_ledger
      - periodic_reconciliation
      - billing_webhook_function_scope_only
      - billing_webhook_cannot_mutate_learning_or_assessment
  analytics_flags:
    candidate: PostHog
    status: candidate
    allowed_data: [C0_public, C5_derived]
    prohibited_data: [C1_account, C2_learning, C3_assessment, C4_security]
    controls:
      - opaque_subject_identifiers
      - assessment_screen_replay_disabled
      - event_property_allow_list
      - privacy_lint_before_release
      - experiment_cannot_bypass_evaluation_or_privacy_gate
  speech:
    candidate: null
    status: deferred_until_speaking_scope
    allowed_data: [C3_assessment]
    controls: [separate_procurement_DPA_retention_quality_benchmark_before_activation, specialist_acoustic_evidence_when_pronunciation_contract_requires_it]

iam:
  default: deny
  web_role_source: server_verified_managed_auth_token_plus_product_role_record
  premium_source: provider_neutral_entitlement_ledger
  internal_function_source: server_verified_job_or_callback_identity_plus_declared_operation_scope
  rules:
    - premium_entitlement_never_changes_learner_role
    - colab_and_admin_are_separate_functions_with_no_implicit_hierarchy
    - colab_author_review_publish_permissions_are_separable
    - admin_cannot_override_evaluation_score
    - colab_cannot_access_arbitrary_learner_assessment_content
    - one_generic_service_identity_never_implies_blanket_domain_authorization
    - evaluation_worker_reads_only_job_required_submission_scope
    - billing_webhook_can_mutate_only_entitlement_reconciliation_state
    - content_job_cannot_read_arbitrary_learner_assessment_content
    - research_benchmark_job_uses_only_approved_corpus_scope
    - elevated_provider_credentials_are_scoped_and_server_only
    - model_or_provider_credentials_do_not_grant_lenbands_authorization
    - break_glass_access_is_disabled_by_default_and_never_inferred_from_admin_role

evaluation:
  score_identities: [official_ielts_score, exam_simulation_estimate, diagnostic_estimate, criterion_evidence, learning_mastery]
  operation_states: [accepted, processing, succeeded, delayed, unavailable, failed, cancelled]
  result_validity_states: [accepted, limited_evidence, insufficient_evidence, invalid, integrity_review]
  route_policy:
    deterministic_prechecks: required_before_model_work_when_applicable
    general_generation: fallback_allowed_only_within_data_privacy_cost_policy
    learner_visible_scoring: fallback_only_among_benchmark_approved_combinations_within_same_scorer_route_version
    hard_case_escalation: stronger_or_second_pass_only_when_uncertainty_or_risk_policy_justifies_cost
    no_approved_route_available: persist_delayed_or_unavailable_do_not_silently_substitute
  stage_policy:
    writing: deterministic_precheck_then_rubric_scorer_then_evidence_validator_then_optional_escalation
    speaking: audio_quality_then_transcript_and_features_then_acoustic_evidence_if_required_then_rubric_scorer_then_validity_gate
    pronunciation: specialist_speech_or_acoustic_measurement_when_required_then_governed_interpretation
    examiner: speaking_followup_generation_is_separate_from_speaking_score_authority
  required_provenance: [score_scope, rubric_version, prompt_hash, model_route_version, model_id, provider_id, task_version, assessment_mode]
  evidence_admission:
    rule: provider_output_is_candidate_observation_or_judgment_until_domain_validation
    prohibited: [raw_model_output_directly_sets_readiness, raw_confidence_percentage_treated_as_probability_without_calibration]
  logs: never_raw_prompt_chain_of_thought_essay_audio_transcript_or_full_provider_payload

durability:
  delivery_semantics: assume_at_least_once_for_workflows_and_webhooks
  rules:
    - all_durable_side_effects_idempotent
    - canonical_state_persisted_before_or_with_orchestration_handoff
    - workflow_retry_cannot_duplicate_evaluation_charge_entitlement_review_card_or_publish_action
    - retry_has_one_owning_layer
    - external_webhook_sequence_may_be_duplicated_or_out_of_order

privacy_retention:
  registry_required: true
  rule: every C1_C4 entity has purpose_owner_retention_delete_or_archive_behavior_before_public_release
  minimization:
    model_context: task_plus_smallest_relevant_learner_state_snapshot
    prohibited_default: unbounded_full_learner_history_to_model_provider
  deletion:
    identity: provider_identity_delete_or_disable_plus_subject_mapping_tombstone_as_policy_requires
    canonical_data: delete_or_anonymize_by_entity_policy
    object_storage: delete_private_objects_and_versions_by_policy
    analytics: only_C5_should_exist; delete_subject_mapping_if_any
    backups: age_out_under_documented_backup_retention; do_not_promise_instant_physical_erasure_without_evidence
  legal_hold: absent_by_default_until_a_separate_approved_policy_exists

backup_recovery:
  implementation_design:
    canonical_database: managed_backup_plus_logical_export_path
    object_storage: exportable_private_objects_with_immutable_or_versioned_assessment_references
    provider_config: version_controlled_non_secret_configuration_plus_reproducible_setup_checklist
    domain_rule: restore_reconciles_from_canonical_state_and_does_not_treat_workflow_cache_or_analytics_as_truth
  release_evidence:
    rpo_rto: numeric_targets_must_be_armed_before_public_release_not_invented_by_agent
    restore_test: restore_or_export_import_drill_with_timestamped_evidence
    consistency_check: database_object_references_and_entitlement_reconciliation_are_verified_after_restore
  rule: absence_of_runtime_restore_evidence_blocks_release_not_source_code_when_the_design_contract_is_already_defined

incident_management:
  classes: [security, privacy, billing, scoring_integrity, data_loss, provider_dependency, availability]
  severities:
    sev0: security_or_data_integrity_compromise_or_systemic_score_corruption
    sev1: major_auth_billing_assessment_or_data_unavailability
    sev2: degraded_noncritical_capability_or_subset_failure
    sev3: minor_defect_without_material_outcome_risk
  response_phases: [detect, contain, preserve_evidence, assess_learner_impact, recover_or_disable, communicate, verify_recovery, follow_up]
  rules:
    - one_incident_owner
    - preserve_evidence_before_destructive_recovery
    - scorer_integrity_incident_can_disable_scoring_without_disabling_saved_submissions
    - privacy_or_security_incident_prioritizes_containment_and_credential_or_access_scope_review
    - billing_incident_does_not_mutate_learning_or_score_state_as_a_repair_shortcut
    - data_loss_recovery_uses_backup_export_and_canonical_reconciliation_not_manual_hidden_rows
    - status_copy_reflects_known_learner_impact_not_vendor_jargon
    - incident_closes_only_after_recovery_verification_and_follow_up_owner
  release_evidence: tabletop_scenarios_cover_each_material_p0_incident_class

support_boundary:
  default_access: metadata_and_opaque_refs_only
  raw_learner_assessment_access: prohibited_by_default
  dispute_types: [score, feedback, content, quota, billing, privacy]
  dispute_states: [opened, triaged, evidence_preserved, action_pending, resolved, rejected]
  rules:
    - every_case_has_case_ref_owner_subject_ref_type_and_audit_timestamps
    - preserve_original_result_content_version_quota_and_operation_refs_before_remediation
    - score_or_feedback_dispute_may_trigger_governed_re_evaluation_but_never_manual_band_edit
    - re_evaluation_creates_a_new_versioned_result_or_operation_and_preserves_prior_history
    - content_dispute_routes_minimum_report_to_content_workflow_without_exposing_arbitrary_learner_history
    - quota_dispute_reconciles_reservation_charge_and_semantic_effect_without_fabricating_evaluation_success
    - billing_case_uses_provider_subject_and_local_entitlement_ref_without_learning_payload
    - learner_receives_truthful_status_or_resolution_reason_without_internal_provider_or_security_secrets
  break_glass:
    p0_default: disabled
    rule: ordinary_admin_and_support_paths_must_work_without_raw_C3_access
    enabling_requires: [separate_policy, explicit_case_and_purpose, minimum_field_scope, independent_authorization, expiry, audit_event, post_access_review]
    non_rule: absence_of_break_glass_is_not_permission_to_grant_broad_admin_read_access
  research_access: approved_benchmark_corpus_only_not_arbitrary_production_browsing

experimentation:
  p0_default: no_experiment_may_change_semantic_truth
  experimentable_surfaces: [copy, layout, non_semantic_ordering, optional_feedback_depth_within_quality_floor]
  invariant_surfaces:
    - authorization_and_privacy
    - entitlement_truth
    - score_identity_and_scope
    - rubric_and_benchmark_approved_scorer_route
    - result_validity_and_evidence_admission
    - content_rights_and_version_truth
    - quota_accounting_semantics
    - release_and_quality_gates
  metric_guardrail: experiment_success_cannot_be_declared_from_engagement_when_verified_learning_or_safety_guardrail_regresses
  rule: feature_flag_or_experiment_configuration_is_not_a_domain_authority

observability:
  allowed: [C5_derived, opaque_refs, operationId, duration, status_or_problem_code, model_route_version, cost_units, escalation_flag, result_validity]
  forbidden: [email_name, essay_audio_transcript_answers, private_notes, secrets, raw_token, provider_payload, prompt_body]
  session_replay: disabled_on_assessment_auth_privacy_billing_and_admin_sensitive_surfaces
  alerts: actionable_symptom_or_threshold_only; dependency_events_are_deduplicated_into_incident_signals
  dashboards:
    product: [activation, time_to_first_useful_value, verified_progress, error_recurrence, independent_retest_or_transfer_outcomes, uncertainty_reduction]
    evaluation: [route_health, result_validity_mix, benchmark_agreement, benchmark_slice_health, uncertainty_calibration, drift, latency, cost, escalation_rate]
    platform: [availability, error_rate, workflow_backlog, database_health, provider_dependency_health]
    operations: [privacy_request_age, entitlement_reconciliation, content_report_age, support_dispute_state, incident_state]

cost:
  routing_order: [deterministic_rule_library_or_sql, versioned_precomputed_result, bounded_small_or_specialist_model, benchmark_approved_stronger_route, safe_degraded_state_or_retry]
  policy:
    - provider_pricing_checked_at_procurement_and_periodically_not_frozen_as_architecture_fact
    - spend_caps_and_alerts_enabled_where_supported
    - evaluation_has_per_request_budget_and_retry_ceiling
    - deterministic_or_precomputed_work_is_used_when_it_meets_required_quality
    - model_context_is_minimized
    - second_or_stronger_pass_only_for_policy_defined_hard_cases
    - degrade_feedback_depth_before_scoring_integrity
    - never_silently_switch_scorer_quality_to_save_cost
    - free_and_premium_share_semantic_truth_and_minimum_scoring_quality_floor
    - cheap_but_non_helpful_generation_is_not_an_optimization
  review_dimensions: [cost_per_active_learner, cost_per_evaluation, cost_per_successful_evaluation, cost_per_verified_improvement, model_escalation_rate, workflow_retry_cost, audio_cost_per_attempt, provider_fixed_cost, egress_or_storage_growth]

procurement_gate:
  required:
    - current_terms_and_DPA_reviewed
    - data_region_and_retention_understood
    - data_classes_allowed
    - credential_scope_documented
    - spend_cap_or_alert_path
    - status_and_incident_contact_path
    - export_or_exit_path
    - provider_specific_security_checklist
  scoring_provider_extra: [benchmark_route_approval, privacy_review, deterministic_model_version_or_route_provenance]
  speech_provider_extra: [audio_retention_review, pronunciation_or_transcription_quality_benchmark_for_announced_use]

release_gate:
  required:
    - API_contract_parse_and_access_matrix_tests
    - typed_operation_payload_contract_complete
    - BOLA_BFLA_negative_tests_for_every_protected_operation_family
    - internal_function_scope_negative_tests
    - privacy_telemetry_lint
    - retention_entity_coverage_and_export_delete_evidence
    - idempotency_replay_tests
    - provider_exit_and_degraded_state_design
    - evaluation_benchmark_and_required_slice_results_for_any_learner_visible_scoring_route
    - result_validity_and_evidence_admission_tests
    - deterministic_vs_inference_boundary_review_for_costly_capabilities
    - assessment_content_and_benchmark_rights_provenance_approved
    - recovery_design_plus_required_restore_or_export_import_evidence
    - material_schema_migration_rehearsal_when_applicable
    - accessibility_and_network_degradation_acceptance_for_p0_critical_path
    - generic_incident_tabletop_evidence
    - approved_pilot_eligibility_jurisdiction_and_provider_processing_decisions_before_real_learner_data
    - same_head_CI_and_trust_boundary_pass
  blocked_if:
    - two_canonical_API_authorities
    - raw_C1_C4_in_general_analytics
    - unbenchmarked_or_failed_required_slice_scorer_route
    - premium_implemented_as_divergent_role_hierarchy
    - generic_service_identity_grants_blanket_domain_access
    - model_output_can_directly_set_readiness_or_entitlement
    - experiment_changes_scoring_evidence_security_privacy_or_entitlement_truth
    - service_key_exposed_to_browser
    - content_or_task_version_mutable_after_it_has_evaluation_evidence
    - privacy_retention_registry_missing_for_activated_C1_C4_entity
    - activated_provider_has_no_procurement_or_exit_record
