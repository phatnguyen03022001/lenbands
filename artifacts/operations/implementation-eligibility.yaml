schema_version: 1.3.0
status: review
source_of_truth: true
contract_id: implementation-eligibility
owner: engineering + operations
purpose: separate product scope, implementation eligibility, authorization and release readiness

axes:
  scope_lifecycle:
    values: [ACTIVE, PLANNED, DEPRECATED]
    meaning: product_scope_only
  implementation_eligibility:
    values: [blocked, eligible]
    evaluated_per: capability_family
    requires:
      - family_dependencies_resolved
      - framework_dependencies_resolved
      - asset_requirements_resolved
      - decision_requirements_resolved
      - required_owner_contracts_approved
      - problem_risk_coverage_assessed
      - no_blocking_problem_risk
      - no_open_critical_or_high_finding_for_family
  implementation_authorization:
    values: [locked, authorized]
    evaluated_per: exact_candidate_sha_and_family
    requires: [family_eligible, founder_authorization_ref, authorization_attestation_ref]
  release_readiness:
    values: [not_ready, ready]
    evaluated_per: release_scope
    requires:
      - runtime_acceptance
      - evidence_integrity
      - privacy_security_quality_cost_gates
      - all_applicable_risk_release_evidence_satisfied
      - legal_rights_and_provider_activation_decisions_satisfied
  public_scale_readiness:
    values: [not_ready, ready]
    evaluated_per: exposed_product_scope
    requires: [release_ready, public_scale_risk_controls_satisfied]

risk_coverage_binding:
  registry: artifacts/operations/problem-risk-registry.yaml
  implementation_rule: >
    Only an unresolved risk explicitly marked implementation_blocking=true keeps source implementation
    in that family blocked. Evidence that can exist only after implementation must not be fabricated or
    used as a circular pre-code prerequisite.
  release_rule: >
    release_evidence_required=true means the owning release/evidence gate must contain real candidate-bound
    evidence before release; risk status covered describes design coverage, not that the evidence has passed.
  scale_rule: >
    public_scale_control_required=true may remain unresolved in a bounded closed pilot only when the closed-pilot
    eligibility policy explicitly permits it; it must be resolved before broader access or monetization.

invariants:
  - ACTIVE_does_not_mean_implementation_authorized
  - implementation_eligibility_does_not_mean_release_ready
  - release_ready_does_not_mean_public_scale_ready
  - one_family_may_be_eligible_while_other_families_remain_blocked
  - closed_pilot_release_may_still_require_all_P0_families_ready
  - authorization_is_bound_to_exact_candidate_sha_and_declared_family_scope
  - evidence_that_requires_runtime_is_never_required_to_start_implementation
  - no_unknown_placeholder_or_unapproved_decision_may_be_silently_coerced_to_eligible
  - risk_status_covered_is_not_runtime_evidence
  - deferred_risk_is_not_equivalent_to_covered
  - synthetic_or_fixture_implementation_does_not_authorize_real_learner_data_collection

current_state:
  repository_authorization_state: none
  source_mutation_default: locked
  authorization_model: external_exact_baseline_sha_plus_family_plus_source_scope
  rule: >
    This contract defines eligibility/readiness semantics but never self-authorizes source mutation.
    A bounded implementation session requires the external authorization described by agent-trust-policy.yaml.
