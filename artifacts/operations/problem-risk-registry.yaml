    acceptance_test: 'Timezone/DST tests do not duplicate or miss daily actions/reviews or rewrite historical instants.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-030
    category: experimentation_metric_integrity
    title: Experiment changes scoring truth security or entitlement semantics by cohort
