    status: covered
    canonical_contracts: [DOCS.yaml, artifacts/operations/documentation-architecture.yaml]
    required_control: 'Start at DOCS.yaml, keep zero live legacy aliases and one semantic owner per field; Git history holds retired migration trace.'
    acceptance_test: 'Authority validators reject split ownership, live legacy aliases and retired build/codegen authority.'
    implementation_blocking: false
    release_evidence_required: false
    public_scale_control_required: false

