schema_version: 1.3.0
status: review
source_of_truth: true
contract_id: problem-risk-coverage
owner: founder + product + engineering + operations
purpose: classify implementation-relevant problem classes without confusing pre-code design blockers with post-code release evidence

coverage_policy:
  statuses: [covered, partial, open, deferred, not_applicable]
  severities: [critical, high, medium, low]
  phases: [P0, P1, P2, OPS]
  p0_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
  covered_rule: covered means a canonical control owner and concrete acceptance boundary exist; it does not mean runtime evidence has passed
  implementation_rule: implementation_blocking is true only when unresolved design or control semantics must be decided before safe source implementation
  release_rule: release_evidence_required marks controls whose runtime, legal, rights, benchmark, recovery or usability evidence must exist before release
  public_scale_rule: public_scale_control_required marks risks that may remain acceptable for a bounded closed pilot but must be resolved before broader access or monetization
  open_high_rule: an open or partial P0 critical/high risk must block implementation, require release evidence, or both; agents may not silently ignore it
  deferred_rule: deferred is allowed only outside the affected current P0 family and is never equivalent to covered
  no_duplication_rule: the registry owns classification only; referenced canonical contracts own actual behavior

categories:
  product_outcome_metric: {p0_applies_to: [P0-02, P0-03, P0-04, P0-05, P0-06]}
  learning_science_transfer: {p0_applies_to: [P0-02, P0-03, P0-04, P0-05]}
  measurement_psychometrics: {p0_applies_to: [P0-02, P0-04, P0-05, P0-06]}
  evaluator_quality_fairness: {p0_applies_to: [P0-04, P0-06]}
  ai_inference_boundary: {p0_applies_to: [P0-03, P0-04, P0-06]}
  personalization_adaptation: {p0_applies_to: [P0-02, P0-03, P0-05]}
  content_quality_rights: {p0_applies_to: [P0-02, P0-04, P0-05, P0-06]}
  identity_authorization: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  privacy_data_governance: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  security_abuse_fraud: {p0_applies_to: [P0-01, P0-03, P0-04, P0-05, P0-06]}
  billing_entitlement: {p0_applies_to: [P0-01, P0-03, P0-04, P0-05, P0-06]}
  support_dispute_breakglass: {p0_applies_to: [P0-01, P0-04, P0-05, P0-06]}
  reliability_disaster_recovery: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  data_schema_migration: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  observability_incident_response: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  cost_unit_economics: {p0_applies_to: [P0-03, P0-04, P0-05, P0-06]}
  accessibility_inclusive_design: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05]}
  device_network_media: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05]}
  time_semantics: {p0_applies_to: [P0-02, P0-03, P0-05]}
  experimentation_metric_integrity: {p0_applies_to: [P0-02, P0-03, P0-04, P0-05, P0-06]}
  vendor_dependency_exit: {p0_applies_to: [P0-01, P0-04, P0-06]}
  documentation_agent_integrity: {p0_applies_to: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]}
  legal_regulatory: {p0_applies_to: [P0-01, P0-02, P0-04, P0-06]}
  reproducibility_model_deprecation: {p0_applies_to: [P0-02, P0-04, P0-06]}

risks:
  - risk_id: RISK-001
    category: product_outcome_metric
    title: Engagement metrics replace verified learning outcomes
    phase: P0
    severity: high
    affected_families: [P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: product + operations
    status: covered
    canonical_contracts: [blueprint/01-product.md, blueprint/06-engines.md]
    required_control: 'Optimize verified improvement and admitted evidence rather than completion, streak or raw engagement.'
    acceptance_test: 'Completion alone cannot promote mastery or readiness.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-002
    category: learning_science_transfer
    title: Practice success is mistaken for independent transfer
    phase: P0
    severity: high
    affected_families: [P0-02, P0-03, P0-04, P0-05]
    owner: product
    status: covered
    canonical_contracts: [blueprint/06-engines.md, artifacts/engineering/contracts/error-to-review/data-contract.md]
    required_control: 'Track exposure and require sufficiently novel independent retest evidence.'
    acceptance_test: 'Revealed or repeated source content cannot resolve an error as independent transfer.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-003
    category: measurement_psychometrics
    title: Missing evidence is interpreted as learner weakness
    phase: P0
    severity: high
    affected_families: [P0-02, P0-03, P0-05]
    owner: product + evaluation
    status: covered
    canonical_contracts: [artifacts/engineering/contracts/placement-diagnosis-contract.md, blueprint/06-engines.md]
    required_control: 'Represent evidence gaps separately from observed performance gaps.'
    acceptance_test: 'An unobserved construct cannot be labeled weak solely because observations are missing.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-004
    category: measurement_psychometrics
    title: Construct underrepresentation and false precision
    phase: P0
    severity: high
    affected_families: [P0-02, P0-04, P0-06]
    owner: evaluation + product
    status: covered
    canonical_contracts: [artifacts/engineering/contracts/placement-diagnosis-contract.md, artifacts/operations/placement-quality-gate.md]
    required_control: 'Version construct coverage and termination policy; withhold unsupported aggregate estimates.'
    acceptance_test: 'Calibration and coverage evidence must support any calibrated score scope before release.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-005
    category: evaluator_quality_fairness
    title: Average benchmark quality hides weak slices or subgroup failure
    phase: P0
    severity: high
    affected_families: [P0-04, P0-06]
    owner: evaluation + operations
    status: covered
    canonical_contracts: [artifacts/operations/evaluation-benchmark-spec.md]
    required_control: 'Use a versioned slice plan and prevent aggregate quality from overriding a failed critical slice.'
    acceptance_test: 'Required slice metrics are reported and armed critical slice failure blocks scorer promotion.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-006
    category: evaluator_quality_fairness
    title: Evaluator drift silently changes score meaning
    phase: P0
    severity: critical
    affected_families: [P0-04, P0-06]
    owner: evaluation + operations
    status: covered
    canonical_contracts: [artifacts/operations/evaluator-drift-incident-runbook.md, artifacts/engineering/contracts/writing-task-2/evaluation-contract.md]
    required_control: 'Bind scorer route, rubric and prompt versions to benchmark/release governance.'
    acceptance_test: 'Unapproved route cannot serve scoring and drift has disable/rollback path.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-007
    category: ai_inference_boundary
    title: AI becomes domain authority for deterministic decisions
    phase: P0
    severity: high
    affected_families: [P0-03, P0-04, P0-06]
    owner: engineering + product
    status: covered
    canonical_contracts: [blueprint/06-engines.md, artifacts/engineering/runtime-contract.yaml]
    required_control: 'Rules, SQL and libraries own deterministic facts; model output is a validated candidate judgment.'
    acceptance_test: 'Model output cannot grant entitlement, set readiness/mastery or choose the P0 daily action.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-008
    category: ai_inference_boundary
    title: Prompt injection from assessed learner content changes evaluator policy
    phase: P0
    severity: critical
    affected_families: [P0-04, P0-06]
    owner: security + evaluation
    status: covered
    canonical_contracts: [artifacts/operations/bops/threat-model.md, artifacts/engineering/contracts/writing-task-2/writing_evaluation_v1.md]
    required_control: 'Treat learner content as untrusted data with no tool/secret/provider control.'
    acceptance_test: 'Adversarial content cannot escape scorer schema/rubric or access tools/secrets.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-009
    category: personalization_adaptation
    title: One observed weakness monopolizes the learner plan
    phase: P0
    severity: high
    affected_families: [P0-02, P0-03, P0-05]
    owner: product
    status: covered
    canonical_contracts: [blueprint/06-engines.md, artifacts/engineering/contracts/daily-action-contract.md]
    required_control: 'Balance evidence uncertainty, coverage, due review, transfer, target relevance, load and exposure novelty.'
    acceptance_test: 'Repeated plans cannot indefinitely starve under-observed target-relevant constructs.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-010
    category: content_quality_rights
    title: Unlicensed stale or mutable assessment content contaminates evaluation
    phase: P0
    severity: critical
    affected_families: [P0-02, P0-04, P0-05, P0-06]
