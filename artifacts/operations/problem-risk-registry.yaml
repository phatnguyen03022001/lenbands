    acceptance_test: 'Experiment configuration cannot select unapproved scorer route or weaken invariant gates.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-031
    category: vendor_dependency_exit
    title: Selected provider disappears changes policy or sharply increases price
    phase: P0
    severity: high
    affected_families: [P0-01, P0-04, P0-06]
    owner: engineering + operations
    status: covered
    canonical_contracts: [artifacts/business/decisions/platform-sourcing.md, artifacts/engineering/runtime-contract.yaml, artifacts/operations/bops/contract.yaml]
    required_control: 'Keep provider-neutral domain contracts, export path, approved scorer routes and safe degraded states.'
    acceptance_test: 'Exit exercise identifies swappable adapters, exportable data and capabilities that must degrade or disable.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-032
    category: documentation_agent_integrity
    title: Agent implements stale or higher-noise document instead of canonical owner
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
