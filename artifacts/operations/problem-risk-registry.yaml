    status: covered
    canonical_contracts: [blueprint/05-content.md, artifacts/engineering/api/schema-contract.yaml]
    required_control: 'Require provenance, rights state, immutable published version and exposure policy.'
    acceptance_test: 'Every released P0 assessment asset has approved rights/provenance and immutable historical references.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-011
    category: content_quality_rights
    title: Taxonomy authoring cost exceeds decision value
    phase: P0
    severity: medium
    affected_families: [P0-04, P0-05, P0-06]
    owner: content + product
    status: covered
    canonical_contracts: [blueprint/05-content.md]
    required_control: 'Require metadata only when an active consumer uses it.'
    acceptance_test: 'Dormant taxonomy does not block P0 publish and material metadata cost is observable.'
    implementation_blocking: false
    release_evidence_required: false
    public_scale_control_required: false

  - risk_id: RISK-012
    category: identity_authorization
    title: BOLA BFLA or entitlement-role collision exposes unauthorized data or function
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: security + engineering
    status: covered
    canonical_contracts: [artifacts/engineering/api/access-control.md, artifacts/engineering/api/openapi.yaml]
    required_control: 'Deny-by-default role entitlement object authorization with RLS defense in depth.'
    acceptance_test: 'Negative access matrix proves cross-user and cross-role denial plus entitlement revocation.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-013
    category: identity_authorization
    title: Generic elevated service identity gains blanket runtime access
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-04, P0-06]
    owner: security + engineering
    status: covered
    canonical_contracts: [artifacts/engineering/api/access-control.md, artifacts/engineering/runtime-contract.yaml]
    required_control: 'Resolve internal calls to function scope and minimum object/data purpose.'
    acceptance_test: 'Evaluation billing content and research scopes cannot execute each other operations.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-014
    category: privacy_data_governance
    title: Raw learner content leaks into telemetry logs queues or unrelated providers
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: privacy + engineering
    status: covered
    canonical_contracts: [artifacts/operations/data-retention-registry.yaml, artifacts/operations/bops/contract.yaml]
    required_control: 'Enforce data classes, opaque references, telemetry deny lists and minimum provider payload.'
    acceptance_test: 'Privacy validators reject forbidden raw fields and sensitive replay is disabled.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-015
    category: privacy_data_governance
    title: Retention export or deletion misses a sensitive runtime entity
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: privacy + operations
    status: covered
    canonical_contracts: [artifacts/operations/data-retention-registry.yaml]
    required_control: 'Map every stored C1-C4 P0 entity to purpose, retention, export and deletion behavior.'
    acceptance_test: 'Entity coverage plus end-to-end export/delete evidence passes before release.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-016
    category: security_abuse_fraud
    title: Cost or resource exhaustion through automated or replayed expensive actions
    phase: P0
    severity: high
    affected_families: [P0-03, P0-04, P0-05, P0-06]
    owner: security + operations
    status: covered
    canonical_contracts: [artifacts/operations/bops/threat-model.md, artifacts/engineering/runtime-contract.yaml]
    required_control: 'Use quota preflight/reservation, idempotency, bounded retry and cost attribution.'
    acceptance_test: 'Replay cannot double-charge and armed limits safely stop pathological request volume.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-017
    category: security_abuse_fraud
    title: Account farming credential sharing or free-tier cycling bypasses economics
    phase: P0
    severity: medium
    affected_families: [P0-01, P0-04, P0-06]
    owner: security + operations
    status: open
    canonical_contracts: []
    required_control: 'Define proportionate abuse signals and response without invasive fingerprinting.'
    acceptance_test: 'Abuse controls are documented and tested before access expands beyond bounded pilot.'
    implementation_blocking: false
    release_evidence_required: false
    public_scale_control_required: true

  - risk_id: RISK-018
    category: billing_entitlement
    title: Duplicate or out-of-order billing events corrupt entitlements
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-03, P0-04, P0-05, P0-06]
    owner: billing + engineering
    status: covered
    canonical_contracts: [artifacts/operations/bops/threat-model.md, artifacts/engineering/api/openapi.yaml]
    required_control: 'Verify raw signature, dedupe event ID, order by occurrence time and reconcile ledger.'
    acceptance_test: 'Duplicate or stale webhook sequence produces one consistent entitlement state.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-019
    category: billing_entitlement
    title: Payment fraud or entitlement abuse creates uncontrolled cost or access
    phase: P0
    severity: medium
    affected_families: [P0-04, P0-06]
    owner: billing + operations
    status: open
    canonical_contracts: [artifacts/operations/bops/contract.yaml]
    required_control: 'Use provider-led fraud/dispute handling with local auditable entitlement reconciliation.'
    acceptance_test: 'Fraud/dispute handling cannot mutate scores/evidence and entitlement rollback is auditable.'
    implementation_blocking: false
    release_evidence_required: false
    public_scale_control_required: true

  - risk_id: RISK-020
    category: support_dispute_breakglass
    title: Learner disputes a score content or quota decision with no governed resolution path
    phase: P0
    severity: high
    affected_families: [P0-04, P0-05, P0-06]
    owner: product + operations
    status: covered
    canonical_contracts: [artifacts/operations/bops/contract.yaml]
    required_control: 'Preserve evidence and resolve through governed re-evaluation, content workflow or quota reconciliation without manual score overwrite.'
    acceptance_test: 'Disputed Writing result preserves prior history and quota accounting while creating a versioned resolution.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-021
    category: support_dispute_breakglass
    title: Support or admin needs sensitive learner data without break-glass policy
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-04, P0-06]
    owner: security + privacy + operations
    status: covered
    canonical_contracts: [artifacts/engineering/api/access-control.md, artifacts/operations/bops/contract.yaml]
    required_control: 'Raw C3 access is disabled by default; enabling requires separate purpose-bound time-limited audited authorization.'
    acceptance_test: 'Ordinary Admin cannot read raw C3 and no implementation assumes break-glass exists.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-022
    category: reliability_disaster_recovery
    title: Backup exists but restore RPO or RTO is unproven
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: operations + engineering
    status: covered
    canonical_contracts: [artifacts/operations/bops/contract.yaml]
    required_control: 'Use managed backup plus logical export design; arm numeric RPO/RTO and exercise restore before release.'
    acceptance_test: 'Restore drill recreates consistent database/object/entitlement state and records actual loss/recovery windows.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-023
    category: reliability_disaster_recovery
    title: Provider or async worker outage loses work or creates duplicate effects
    phase: P0
    severity: critical
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: engineering + operations
    status: covered
    canonical_contracts: [artifacts/engineering/runtime-contract.yaml]
    required_control: 'Use durable operations, idempotent effects, bounded retry and truthful degraded states.'
    acceptance_test: 'Worker/provider failure does not lose accepted input or duplicate effects.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-024
    category: data_schema_migration
    title: Schema migration or backfill corrupts source or derived learner state
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: engineering
    status: covered
    canonical_contracts: [artifacts/engineering/data-migration-contract.yaml]
    required_control: 'Use additive or expand-contract migration, replay-safe backfill and rebuildable derived projections.'
    acceptance_test: 'Representative migration preserves source state, replays safely and rebuilds projections.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-025
    category: observability_incident_response
    title: Security privacy billing scoring data-loss or provider incidents lack one response model
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05, P0-06]
    owner: operations + security
    status: covered
    canonical_contracts: [artifacts/operations/bops/contract.yaml, artifacts/engineering/contracts/runtime/observability-slo-contract.md]
    required_control: 'Use common incident classes, severity, containment, evidence preservation, recovery and communication phases.'
    acceptance_test: 'Tabletop scenarios cover material P0 incident classes with named owners/actions.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-026
    category: cost_unit_economics
    title: Cheap requests optimize spend while learner outcome remains poor
    phase: P0
    severity: high
    affected_families: [P0-03, P0-04, P0-05, P0-06]
    owner: product + operations
    status: covered
    canonical_contracts: [blueprint/01-product.md, blueprint/06-engines.md, artifacts/operations/bops/contract.yaml]
    required_control: 'Observe cost per accepted evaluation and cost per verified improvement without lowering quality floor.'
    acceptance_test: 'Pilot economics binds cost to accepted evaluation and verified retest outcomes.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-027
    category: accessibility_inclusive_design
    title: Core learner flow is unusable with keyboard screen reader zoom or reduced motion
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05]
    owner: experience + engineering
    status: covered
    canonical_contracts: [artifacts/experience/critical-path-usability-contract.yaml]
    required_control: 'Build P0 surfaces with keyboard, semantic, focus, reflow and reduced-motion requirements from component design.'
    acceptance_test: 'Critical path passes keyboard, screen-reader semantics, 200-percent zoom/reflow, focus/error and reduced-motion checks.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-028
    category: device_network_media
    title: Browser or network interruption loses drafts attempts or session state
    phase: P0
    severity: high
    affected_families: [P0-01, P0-02, P0-03, P0-04, P0-05]
    owner: experience + engineering
    status: covered
    canonical_contracts: [artifacts/experience/critical-path-usability-contract.yaml, artifacts/engineering/runtime-contract.yaml]
    required_control: 'Use local preservation where safe, optimistic versioning and idempotent retry without making browser storage canonical truth.'
    acceptance_test: 'Critical flows survive refresh, transient network loss and duplicate submit without data loss or duplicate effect.'
    implementation_blocking: false
    release_evidence_required: true
    public_scale_control_required: false

  - risk_id: RISK-029
    category: time_semantics
    title: Timezone midnight or DST changes corrupt daily plan exam countdown or review due state
    phase: P0
    severity: medium
    affected_families: [P0-02, P0-03, P0-05]
