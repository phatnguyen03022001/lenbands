schema_version: 1.0.0
status: draft
scope: closed_pilot_p0
source_of_truth: false
description: >
  Typed capability manifest seed for compiling P0 artifact families and semantic graph edges.
  This is an operational projection seed, not a source of truth. Blueprint/03-features.md
  remains authoritative for capability identity and product semantics.

capability_families:
  - family_id: P0-01
    implementation_family_id: IDENTITY.Core
    family_name: identity
    capability_ids: [IDENTITY.Auth, IDENTITY.Profile, IDENTITY.Privacy]
    owner: engineering
    phase: P0
    user_outcome: learner_has_account_consent_and_data_ownership
    dependencies: [managed_auth_boundary]
    inputs: [email_or_oauth_assertion, consent_choice, profile_seed]
    outputs: [account_ref, consent_record_ref, learner_profile_ref]
    states: [anonymous, authenticating, active, consent_required, recovery_required, deletion_requested]
    api_operations: [getMyProfile, updateMyProfile]
    data_entities: [Account, ConsentRecord, LearnerProfile]
    events_published: [account_created, consent_recorded, privacy_export_requested, privacy_deletion_requested]
    events_consumed: []
    failure_modes: [AUTH_UNAVAILABLE, PERMISSION_DENIED, PRIVACY_EXPORT_FAILED]
    knowledge_refs: []
    metrics: [activation_account_created, consent_completion_rate, privacy_request_completion]
    cost_boundary: managed_auth_pilot
    privacy_class: account
    quality_gate: identity_privacy_acceptance
    fallback: deny_by_default_with_recovery_path
    artifacts_required: [experience_contract, vertical_slice_spec, auth_identity_contract, privacy_acceptance_run, provider_dpa_evidence]
    artifacts_current:
      - path: artifacts/experience/specs/vertical-slices/identity-consent.md
        status: draft
      - path: artifacts/engineering/contracts/runtime/auth-identity-contract.md
        status: review
    evidence_required: [provider_dpa, export_delete_acceptance_run]
    readiness_state: not_ready
    readiness_blockers: [provider_dpa_missing, export_delete_acceptance_not_run, founder_approval_pending]

  - family_id: P0-02
    implementation_family_id: PLACEMENT.Diagnosis
    family_name: diagnosis
    capability_ids: [GOAL.Target, PLACE.Test, PLACE.BandEstimation, PLACE.GapDetection, PLACE.InitialPath, PLACE.SkillDiagnosis, BAND.Current]
    owner: product
    phase: P0
    user_outcome: learner_has_baseline_goal_and_reasoned_plan_seed
    dependencies: [published_placement_configuration]
    inputs: [goal_input, placement_responses, module_preference]
    outputs: [goal_ref, placement_attempt_ref, band_estimate_ref, initial_path_ref]
    states: [not_started, in_progress, scored, insufficient_evidence, retry_required]
    api_operations: [startPlacement, submitPlacementResponse, getPlacementAttempt]
    data_entities: [Goal, PlacementAttempt, BandEstimate, GapProfile]
    events_published: [goal_set, placement_started, placement_completed]
    events_consumed: [account_created]
    failure_modes: [INSUFFICIENT_EVIDENCE, CONFIG_NOT_PUBLISHED, SCORING_UNAVAILABLE]
    knowledge_refs: [blueprint/framework/exam-module-differences.md, blueprint/framework/skill-questiontype-band.md]
    metrics: [placement_completion_rate, calibration_error, insufficient_evidence_rate]
    cost_boundary: placement_pilot
    privacy_class: learning
    quality_gate: placement_quality_gate
    fallback: explain_insufficient_data_and_retry
    artifacts_required: [experience_contract, vertical_slice_spec, placement_diagnosis_contract, calibration_evidence, acceptance_run]
    artifacts_current:
      - path: artifacts/experience/specs/vertical-slices/placement-and-plan.md
        status: draft
      - path: artifacts/engineering/contracts/placement-diagnosis-contract.md
        status: review
      - path: artifacts/operations/placement-quality-gate.md
        status: review
    evidence_required: [placement_calibration_run, placement_acceptance_run]
    readiness_state: not_ready
    readiness_blockers: [calibration_evidence_missing, acceptance_not_run, founder_approval_pending]

  - family_id: P0-03
    implementation_family_id: STUDY.DailyAction
    family_name: daily_action
    capability_ids: [STUDY.DailyPlan, STUDY.CheckIn, STUDY.MicroSession, PERSONAL.NextBestAction]
    owner: product
    phase: P0
    user_outcome: learner_gets_one_reasoned_useful_action_for_today
    dependencies: [P0-02]
    inputs: [learner_state_ref, goal_ref, recent_activity_refs]
    outputs: [daily_plan_ref, next_action_ref, session_ref]
    states: [no_plan, plan_ready, action_started, paused, completed, fallback_offered]
    api_operations: [getTodayPlan, startStudySession, updateStudySession]
    data_entities: [DailyPlan, NextAction, StudySession]
    events_published: [daily_plan_generated, session_started, session_paused, session_resumed, session_completed, session_abandoned, first_meaningful_session_completed, next_best_action_shown, next_best_action_taken]
    events_consumed: [placement_completed, goal_set, review_completed, retest_completed]
    failure_modes: [NO_ELIGIBLE_ACTION, STALE_PLAN, SESSION_RESTORE_FAILED]
    knowledge_refs: []
    metrics: [daily_action_start_rate, first_meaningful_session_rate, session_completion_rate]
    cost_boundary: rules_first
    privacy_class: learning
    quality_gate: daily_action_acceptance
    fallback: show_up_to_three_reasoned_alternatives
    artifacts_required: [experience_contract, vertical_slice_spec, daily_action_contract, session_event_contract, acceptance_run]
    artifacts_current:
      - path: artifacts/experience/specs/vertical-slices/daily-action.md
        status: draft
      - path: artifacts/engineering/contracts/daily-action-contract.md
        status: review
    evidence_required: [daily_action_acceptance_run]
    readiness_state: not_ready
    readiness_blockers: [acceptance_not_run, founder_approval_pending]

  - family_id: P0-04
    implementation_family_id: WRITING.Evaluation
    family_name: writing_evaluation
    capability_ids: [LEARN.Writing, EVAL.Writing, COACH.ErrorAnalysis, COACH.Feedback, PKM.Drafts]
    owner: product + engineering
    phase: P0
    user_outcome: learner_submits_task2_and_gets_evidence_linked_feedback
    dependencies: [published_writing_task, rubric_version, error_taxonomy_version, runtime_contract_pack]
    inputs: [task_ref, draft_ref, essay_text_ref, rubric_version, learner_context]
    outputs: [submission_ref, evaluation_ref, prioritized_error_ref, feedback_ref]
    states: [drafting, submitted, processing, scored, low_confidence, delayed, unavailable, invalid, anti_gaming_review, failed]
    api_operations: [getWritingTask, saveWritingDraft, createWritingSubmission, getWritingSubmission, retryWritingEvaluation, getWritingEvaluation, submitWritingFeedback]
    data_entities: [WritingTask, WritingDraft, WritingSubmission, WritingEvaluation, FeedbackFinding]
    events_published: [writing_task_opened, writing_draft_saved, writing_submission_started, writing_submission_accepted, evaluation_submitted, evaluation_scored, evaluation_failed, evaluation_delayed, writing_feedback_viewed]
    events_consumed: [quota_warning_shown, quota_exceeded]
    failure_modes: [EVAL_LOW_CONFIDENCE, EVAL_INSUFFICIENT_EVIDENCE, EVAL_TIMEOUT, EVAL_PROVIDER_UNAVAILABLE, QUOTA_EXCEEDED]
    knowledge_refs: [blueprint/framework/band-descriptor-map.md, blueprint/framework/error-taxonomy.md, blueprint/framework/writing-task-framework.md]
    metrics: [criterion_mae, overall_band_mae, evidence_validity_rate, low_confidence_false_accept_rate, cost_per_accepted_evaluation, p95_evaluation_latency]
    cost_boundary: writing_eval_pilot
    privacy_class: assessment
    quality_gate: writing_benchmark_and_release_gate
    fallback: preserve_submission_and_return_delayed_or_low_confidence_state
    artifacts_required: [experience_contract, vertical_slice_spec, runtime_spec, openapi, data_contract, event_contract, failure_contract, evaluation_contract, prompt_contract, runtime_contract_pack, benchmark_run, redaction_check, acceptance_run]
    artifacts_current:
      - path: artifacts/experience/specs/vertical-slices/writing-task-2.md
        status: draft
      - path: artifacts/engineering/contracts/writing-task-2/runtime-spec.md
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/openapi.yaml
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/data-contract.md
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/event-contract.md
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/failure-contract.md
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/evaluation-contract.md
        status: review
      - path: artifacts/engineering/contracts/writing-task-2/writing_evaluation_v1.md
        status: review
    evidence_required: [gold_corpus, benchmark_run, redaction_acceptance_run, idempotency_acceptance_run]
    readiness_state: not_ready
    readiness_blockers: [gold_corpus_missing, benchmark_not_run, numeric_thresholds_unapproved, acceptance_not_run, founder_approval_pending]

  - family_id: P0-05
    implementation_family_id: REVIEW.ErrorToReview
    family_name: error_to_review
    capability_ids: [REVIEW.MistakeNotebook, REVIEW.FSRS, REVIEW.SmartQueue, PRACTICE.Drill]
    owner: product
    phase: P0
    user_outcome: learner_fixes_reviews_and_retests_one_evidence_backed_error
    dependencies: [P0-04, error_taxonomy_version]
    inputs: [learning_error_ref, review_card_ref, learner_rating, retest_response_ref]
    outputs: [review_schedule_ref, review_result_ref, retest_result_ref, error_resolution_state]
    states: [no_evidence_no_card, card_created, learning, review, relearning, graduated, retest_in_progress, retest_scored, resolved]
    api_operations: [listWritingErrors, saveWritingError, getWritingError, completeWritingErrorFix, startWritingErrorRetest, listReviewCards, rateReviewCard]
    data_entities: [LearningError, ReviewCard, ReviewAttempt, RetestAttempt]
    events_published: [learning_error_saved, review_card_created, review_queue_opened, review_card_rated, review_completed, review_card_graduated, retest_started, retest_completed, learning_error_resolved]
    events_consumed: [evaluation_scored]
    failure_modes: [NO_EVIDENCE_NO_CARD, REVIEW_QUEUE_EMPTY, RETEST_INVALID]
    knowledge_refs: [blueprint/framework/error-taxonomy.md, blueprint/framework/review-mapping.md]
    metrics: [review_completion_rate, retest_accuracy_pct, error_recurrence_rate, resolved_error_rate]
    cost_boundary: deterministic_fsrs
    privacy_class: learning
    quality_gate: error_to_review_acceptance
    fallback: empty_queue_offers_alternative_action
    artifacts_required: [experience_contract, vertical_slice_spec, data_contract, event_contract, failure_contract, fsrs_rule, retest_acceptance_run]
    artifacts_current:
      - path: artifacts/experience/specs/vertical-slices/error-to-review.md
        status: review
      - path: artifacts/engineering/contracts/error-to-review/data-contract.md
        status: review
      - path: artifacts/engineering/contracts/error-to-review/event-contract.md
        status: review
      - path: artifacts/engineering/contracts/error-to-review/failure-contract.md
        status: review
    evidence_required: [review_scheduling_acceptance_run, retest_outcome_acceptance_run]
    readiness_state: not_ready
    readiness_blockers: [acceptance_not_run, founder_approval_pending]

  - family_id: P0-06
    implementation_family_id: OPS.QualityEconomics
    family_name: quality_economics
    capability_ids: [OPS.CostBudget, OPS.ModelRouting, OPS.Quota, OPS.Observability, OPS.ReleaseGate, OPS.EvaluationQuality, OPS.ContentQuality, OPS.OutcomeMeasurement, GOVERNANCE.ConfidenceScore, GOVERNANCE.AuditTrail]
    owner: operations
    phase: P0
    user_outcome: pilot_cannot_ship_without_trust_privacy_quality_and_cost_controls
    dependencies: [P0-01, P0-04, P0-05]
    inputs: [benchmark_run_ref, cost_measurement_ref, event_stream_ref, release_candidate_ref]
    outputs: [release_decision_ref, quality_status_ref, cost_status_ref, audit_trail_ref]
    states: [unarmed, collecting_evidence, blocked, approved_for_pilot, rolled_back]
    api_operations: [getQualityGate, evaluateQualityGate, getMyQuota]
    data_entities: [BenchmarkRun, CostMeasurement, ReleaseGateDecision, AuditRecord]
    events_published: [benchmark_run_completed, drift_threshold_exceeded, anti_gaming_flagged, quota_warning_shown, quota_exceeded]
    events_consumed: [evaluation_submitted, evaluation_scored, evaluation_failed, evaluation_delayed, retest_completed]
    failure_modes: [RELEASE_BLOCKED, COST_CEILING_UNARMED, BENCHMARK_MISSING, DRIFT_THRESHOLD_EXCEEDED]
    knowledge_refs: []
    metrics: [overall_band_mae, criterion_mae, cost_per_meaningful_outcome, quota_breach_rate, drift_rate, privacy_violation_count]
    cost_boundary: quality_release_gate
    privacy_class: derived
    quality_gate: release_gate
    fallback: block_release_or_degrade_non_critical_detail
    artifacts_required: [benchmark_spec, cost_budget, release_gate, observability_contract, event_schema_pack, quota_contract, dashboard_spec, immutable_evidence_records]
    artifacts_current:
      - path: artifacts/operations/evaluation-benchmark-spec.md
        status: review
      - path: artifacts/operations/cost-budget.md
        status: draft
      - path: artifacts/operations/release-gate.md
        status: review
      - path: artifacts/engineering/contracts/runtime/observability-slo-contract.md
        status: review
      - path: artifacts/engineering/contracts/events/event-schema-pack.md
        status: review
      - path: artifacts/engineering/contracts/quota-usage/quota-usage-contract.md
        status: review
      - path: artifacts/experience/specs/vertical-slices/governance-ops-dashboard.md
        status: review
    evidence_required: [gold_corpus, benchmark_run, numeric_cost_threshold_approval, rollout_rollback_record]
    readiness_state: not_ready
    readiness_blockers: [gold_corpus_missing, benchmark_not_run, numeric_thresholds_unapproved, founder_approval_pending]
