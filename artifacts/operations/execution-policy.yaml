schema_version: 1.2.0
status: review
source_of_truth: false
authority_class: projection
projection_id: compute-execution-policy
purpose: project the lowest sufficient compute mode for exact canonical decision units without owning capability or domain semantics

architecture_principles:
  - domain_contracts_own_canonical_semantics_and_decisions
  - execution_policy_projects_lowest_sufficient_computation_for_exact_canonical_decision_units
  - probabilistic_components_are_inference_executors_never_canonical_decision_owners
  - generated_presentation_is_non_authoritative_and_cannot_mutate_facts_or_decisions
  - compute_mode_change_is_a_governed_architectural_change_not_an_implementation_optimization
  - probabilistic_output_must_bind_evidence_and_provenance_before_domain_acceptance
  - compute_selection_requires_explicit_sufficiency_evidence_not_architectural_preference

compute_modes: [deterministic, statistical_optimization, specialized_model_api, generative_model]
selection_order: [deterministic, statistical_optimization, specialized_model_api, generative_model]

sufficiency_evaluation:
  required_dimensions: [product_outcome, quality, latency, cost, privacy, reliability]
  unit_specific_dimensions: [product_outcome, quality]
  profile_bound_dimensions: [latency, cost, privacy, reliability]
  rule: select the lowest compute mode that satisfies every required dimension for the exact decision unit
  profile_binding_rule: every Tier-A decision policy must bind exactly one compatible sufficiency_profile; the profile supplies cross-cutting design constraints and never capability semantics
  evidence_levels:
    design:
      meaning: contract_and_architecture_evidence_sufficient_to_select_a_candidate_compute_boundary
      may_claim_product_outcome_validation: false
      may_claim_calibration: false
      may_claim_readiness: false
      may_claim_release_approval: false
    empirical:
      meaning: measured_acceptance_benchmark_or_runtime_evidence_bound_by_evidence_integrity
      requires_evidence_integrity: true
      requires_bound_run_or_measurement_refs: true
  design_evidence_authorizes: compute_boundary_for_candidate_implementation_only
  empirical_evidence_required_for: [product_outcome_claim, calibration_claim, readiness_promotion, release_approval]

sufficiency_profiles:
  p0_deterministic_domain:
    evidence_level: design
    applies_to_modes: [deterministic]
    dimensions:
      latency: {authority_ref: artifacts/engineering/contracts/runtime/observability-slo-contract.md, disposition: governed_by_runtime_slo_without_model_network_dependency}
      cost: {authority_ref: artifacts/engineering/runtime/quality-economics-runtime.md, disposition: deterministic_or_managed_compute_cost_governed_without_model_escalation}
      privacy: {authority_ref: artifacts/operations/bops/contract.yaml, disposition: no_probabilistic_transfer_required_for_the_decision}
      reliability: {authority_ref: artifacts/engineering/runtime-contract.yaml, disposition: deterministic_domain_state_and_idempotency_rules_remain_authoritative}
  p0_writing_semantic_inference:
    evidence_level: design
    applies_to_modes: [generative_model]
    dimensions:
      latency: {authority_ref: artifacts/engineering/contracts/runtime/observability-slo-contract.md, disposition: bounded_async_evaluation_route_with_delayed_or_unavailable_recovery}
      cost: {authority_ref: artifacts/operations/cost-budget.md, disposition: bounded_provider_attempt_and_founder_approved_cost_gate_required}
      privacy: {authority_ref: artifacts/operations/bops/contract.yaml, disposition: minimum_assessment_payload_only_with_provider_control_and_no_general_telemetry_copy}
      reliability: {authority_ref: artifacts/engineering/runtime-contract.yaml, disposition: provider_failure_cannot_change_score_semantics_and_unapproved_fallback_is_forbidden}

projection_rules:
  policy_may_not_create_capabilities: true
  policy_may_not_create_decision_units: true
  exact_domain_unit_binding_required: true
  fuzzy_unit_matching_forbidden: true
  canonical_semantics_remain_in_domain_owner: true
  model_output_is_candidate_inference_only: true
  canonical_state_mutation_requires_deterministic_domain_decision: true
  higher_compute_mode_requires_exact_lower_mode_insufficiency_evidence: true
  future_defaults_do_not_authorize_implementation: true
  design_sufficiency_may_not_claim_empirical_validity: true
  presentation_uses_deterministic_compute_in_p0: true

canonical_unit_sources:
  - {meta_ref: artifacts/engineering/contracts/daily-action-contract.meta.yaml, contract_version: 0.3.0}
  - {meta_ref: artifacts/engineering/contracts/placement-diagnosis-contract.meta.yaml, contract_version: 0.3.0}
  - {meta_ref: artifacts/engineering/contracts/evaluation/evaluation-contract.meta.yaml, contract_version: 0.3.0}
  - {meta_ref: artifacts/engineering/contracts/error-to-review/data-contract.meta.yaml, contract_version: 0.3.0}
  - {meta_ref: artifacts/engineering/runtime/quality-economics-runtime.meta.yaml, contract_version: 0.2.0}

tiering:
  A: {meaning: active_or_p0_executable, requires_full_decision_policy: true, requires_sufficiency_evidence: true}
  B: {meaning: near_horizon_before_implementation, requires_full_decision_policy_before_authorization: true, requires_sufficiency_evidence_before_authorization: true}
  C: {meaning: future_catalog, coarse_disposition_only: true}

forbidden_probabilistic_decision_classes:
  - authentication
  - authorization
  - entitlement
  - idempotency
  - quota_enforcement
  - canonical_state_transition
  - fsrs_schedule_transition
  - objective_answer_key_scoring
  - score_aggregation
  - deterministic_recommendation_priority
  - canonical_readiness_aggregation

