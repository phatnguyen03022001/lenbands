schema_version: 1.0.0
status: review
source_of_truth: true
authority_scope: domain_automation_measurement
success_metric: business_automation_coverage
non_goal: infrastructure_automation_platform
principle: business_value_logic_lives_in_domain_contracts_and_managed_runtime_remains_replaceable
policy_invariants:
  - business_logic_domain_owned
  - provider_semantics_neutral
  - commodity_runtime_not_custom
  - adapter_exit_path_required
  - evidence_required_for_readiness

commodity_concerns:
  - authentication
  - durable_execution
  - relational_storage
  - object_storage
  - cache
  - search
  - vector_retrieval
  - analytics
  - feature_flags
  - billing
  - email
  - observability
  - model_gateway

domains:
  repository:
    coverage_state: enforced
    authorities: [DOCS.yaml, tools/toolchain.yaml, artifacts/operations/agent-trust-policy.yaml]
    controls:
      - {id: repository_contract, command: verify}
      - {id: agent_onboarding, command: context}
      - {id: anti_bypass, command: validate trust-boundary}
      - {id: ownership, command: validate contract-ownership}
      - {id: implementation_eligibility, command: validate implementation-catalog}
    gaps: []
  knowledge:
    coverage_state: partial
    authorities: [blueprint/framework/README.md, knowledge-assets/README.md, artifacts/operations/review-remediation-dispositions.yaml]
    controls:
      - {id: terminology_and_remediation, command: validate framework}
      - {id: knowledge_integrity, command: validate knowledge-assets}
      - {id: lineage, command: validate evidence-lineage}
    gaps: [rights_and_content_review_evidence, calibrated_difficulty_registry]
  learning:
    coverage_state: partial
    authorities: [blueprint/03-features.md, blueprint/framework/README.md, artifacts/operations/implementation-eligibility.yaml]
    controls:
      - {id: capability_learning_coverage, command: validate implementation-catalog}
      - {id: framework_semantics, command: validate framework}
    gaps: [runtime_learning_evidence, recommendation_acceptance_evidence]
  assessment:
    coverage_state: evidence_blocked
    authorities: [artifacts/engineering/api/schema-contract.yaml, artifacts/operations/benchmark/gold-corpus-manifest.yaml, artifacts/operations/evidence-integrity.yaml]
    controls:
      - {id: semantic_contracts, command: validate semantic-contracts}
      - {id: benchmark_contract, command: validate benchmark-contracts}
      - {id: release_threshold, command: gate p0}
    gaps: [gold_corpus, examiner_labels, numeric_threshold_approval, benchmark_run]
  ai:
    coverage_state: partial
    authorities: [artifacts/engineering/runtime-contract.yaml, artifacts/business/decisions/platform-sourcing.md, artifacts/operations/spawn-prompts/registry.yaml]
    controls:
      - {id: prompt_lineage, command: validate spawn-prompts}
      - {id: evidence_lineage, command: validate evidence-lineage}
      - {id: provider_boundary, command: validate platform-boundary}
    gaps: [runtime_model_evaluation, provider_switch_evidence, cost_route_evidence]
  release:
    coverage_state: evidence_blocked
    authorities: [artifacts/operations/implementation-eligibility.yaml, artifacts/operations/evidence-integrity.yaml, artifacts/operations/build-readiness-matrix.md]
    controls:
      - {id: repository_verification, command: verify}
      - {id: toolchain_freeze, command: gate toolchain}
      - {id: p0_readiness, command: gate p0}
    gaps: [registered_runtime_harness, p0_acceptance_runs, founder_approvals, benchmark_evidence]
  runtime_integration:
    coverage_state: adapter_only
    authorities: [artifacts/engineering/runtime-contract.yaml, artifacts/business/decisions/platform-sourcing.md, artifacts/engineering/api/openapi.yaml]
    controls:
      - {id: no_reinvented_runtime, command: validate platform-boundary}
      - {id: ownership, command: validate contract-ownership}
      - {id: deterministic_projection, command: generate all}
    gaps: [provider_procurement, provider_integration_evidence, restore_drill]
