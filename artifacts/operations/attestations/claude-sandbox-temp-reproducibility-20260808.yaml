notes:
  - Independent bounded-session reproduction showed mktemp failing under the Claude sandbox although terminal-only verification passed.
  - Version 1.6.1 attempted standard POSIX/macOS temp allow-writes, but a second bounded-session reproduction showed shell mktemp remained blocked; 1.6.2 supersedes that incomplete approach.
  - The change preserves failIfUnavailable and forbids unsandboxed command escape.
  - Skill inline-shell preprocessing is disabled so skill content cannot bypass the registered Bash guard.
  - MCP tools are denied by default pending a versioned plugin and server allowlist.
  - The user-level claude-api skill shadow is disabled because it overrides the bundled command and conflicts with provider-neutral DeepSeek routing.
  - Toolchain 1.6.1 preserved public commands and arguments but did not close the bounded-session reproduction.
  - P0 readiness remains blocked; no runtime, evidence, rights, calibration or approval claim was created.
