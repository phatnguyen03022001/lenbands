notes:
  - Bounded-session reproduction isolated the failure to BSD/macOS mktemp calls without explicit templates.
  - Bare mktemp may ignore TMPDIR on macOS even though the stable CLI exports a writable workspace-local value.
  - Doctor and all three temporary-output generators now pass explicit templates beneath the configured TMPDIR.
  - Tooling contract regression tests reject future bare mktemp or mktemp -d calls in those generators.
  - Sandbox fail-closed behavior remains active and no external filesystem allowWrite or unsandboxed escape was introduced.
  - Toolchain advances from 1.6.3 to 1.6.4 without changing public commands or arguments.
  - P0 readiness remains blocked and no runtime, evidence, rights, calibration or approval claim was created.
