schema_version: 1.1.0
status: review
source_of_truth: true
authority: artifacts/operations/architecture-frozen.md
description: >
  Canonical implementation-family registry. A family is a runtime implementation unit,
  not a domain taxonomy. Capability identity remains authoritative in blueprint/03-features.md.

family_schema:
  required:
    - family_id
    - family_version
    - status
    - last_changed
    - compatible_since
    - purpose
    - owner
    - runtime_boundary
    - owner_spec
    - allowed_deltas
    - shared_contracts
    - shared_entities
    - shared_events
    - shared_failures
    - shared_acceptance
    - shared_evidence
  required_for_active:
    - owner_spec
    - interaction_spec
    - shared_contracts
    - shared_entities
    - shared_events
    - shared_failures
    - shared_acceptance
    - shared_evidence
  invariants:
    - family_id_unique
    - owner_spec_unique
    - owner_spec_maps_to_one_family
    - family_owns_behavior_delta_owns_variation
    - no_capability_family_cycle
    - active_family_shared_contracts_reference_current_working_tree_authorities_only
    - retired_contract_paths_never_reenter_active_family_registry

families:
  - family_id: IDENTITY.Core
    family_version: 1.1.0
    status: candidate
    last_changed: 2026-08-21
    compatible_since: 1.0.0
    purpose: Account, consent, profile ownership, browser-session security, and privacy boundary for the pilot.
    owner: product+engineering
    lifecycle: ACTIVE
    runtime_boundary: authenticated learner identity, recent-auth, consent, and privacy boundary
    owner_spec: artifacts/engineering/runtime/identity-core-runtime.md
    interaction_spec: artifacts/experience/specs/interaction/identity-core.md
    allowed_deltas: []
    shared_contracts:
      - artifacts/engineering/api/access-control.md
      - artifacts/engineering/api/openapi.yaml
      - artifacts/engineering/api/schema-contract.yaml
      - artifacts/engineering/api/type-system.yaml
      - artifacts/engineering/runtime-contract.yaml
      - artifacts/operations/data-retention-registry.yaml
    shared_entities: [Profile, ConsentRecord, AsyncRequest]
    shared_events: [account_created, consent_recorded, privacy_export_requested, privacy_deletion_requested]
    shared_failures: [AUTH_UNAVAILABLE, PERMISSION_DENIED, PRIVACY_EXPORT_FAILED]
    shared_acceptance: [identity_privacy_acceptance]
    shared_evidence: [provider_dpa, export_delete_acceptance_run, session_security_acceptance_run]

