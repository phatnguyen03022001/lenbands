schema_version: 1.0.0
status: review
source_of_truth: true
authority_scope: agent_change_and_anti_bypass_policy
principles:
  - agents_may_change_implementation_but_not_silently_weaken_authority
  - validators_gates_and_evidence_require_role_separated_review_and_founder_authorization
  - immutable_evidence_may_be_added_but_not_modified_or_deleted
  - repository_checks_do_not_replace_live_host_control_evidence
  - host_enforcement_claims_are_observed_facts_not_repository_policy_assertions

