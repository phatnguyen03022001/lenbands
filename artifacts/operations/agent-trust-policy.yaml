application_builder:
  phase_gate:
    state: document_convergence
    compatibility_mode: true
    authority: non_authoritative_fail_closed_compatibility
    source_mutation: locked
    scope: migration_to_family_scoped_authorization
    canonical_authorization_contract: artifacts/operations/implementation-eligibility.yaml
    locked_source_roots: [apps, services, engines]
    partial_pack_unlock_allowed: false
    founder_authorization_ref: null
    completion_attestation_ref: null
    unresolved_gap_budget: 0
    unlock_requires:
      - all_180_capabilities_semantically_complete_and_traceable
      - all_roles_permissions_and_user_journeys_complete
      - all_ielts_controlled_vocabularies_mapped_without_unknown_placeholders
      - all_product_ux_state_and_accessibility_decisions_approved
      - all_data_api_event_failure_privacy_and_security_contracts_approved
      - all_learning_assessment_ai_governance_and_provider_boundaries_approved
      - all_nfr_observability_operations_recovery_and_release_contracts_approved
      - no_duplicate_or_ambiguous_canonical_owner
      - no_draft_or_review_authority_required_by_the_application
      - external_claims_have_citations_and_rights_or_provenance_state
      - independent_semantic_and_red_team_audits_have_no_open_critical_or_high_findings
      - explicit_global_founder_authorization
    non_unlocking_signals:
      - source_directories_exist
      - implementation_agents_exist
      - implementation_skill_exists
      - verify_passes
      - toolchain_gate_passes
      - p0_contracts_exist
      - prose_claims_document_completeness
    migration_note: >-
      This legacy all-application gate remains only as a fail-closed compatibility surface
      for current shared Claude guards. It is not an implementation authorization model and
      may not be used to deny or grant eligibility semantics. The canonical authorization
      model is artifacts/operations/implementation-eligibility.yaml and is family-scoped
      plus exact-candidate-SHA scoped.
  source_workspaces:
    application_candidate: apps/web
    legacy_locked_roots: [services, engines]
    rule: paths_do_not_select_languages_services_or_provider_topology
  orchestrator:
    route: explicit_cli_pro_escalation
    model: deepseek-v4-pro
  workers:
    model_alias: haiku
    resolved_model: deepseek-v4-flash
    implementation_agent: runtime-composer
    verification_agent: runtime-integration-verifier
    deprecated_compatibility_agents: [nextjs-implementer, go-backend-implementer, python-evaluation-implementer]
  execution_boundary:
    - registered_native_dependency_command_after_authorization
    - registered_native_build_lint_typecheck_test_after_authorization
    - deterministic_contract_codegen
    - registered_lenbands_validation
  forbidden_execution:
    - shell_chaining
    - arbitrary_interpreter_execution
    - protected_path_mutation
    - evidence_fabrication
    - unsandboxed_escape
    - preselected_runtime_topology_before_authorization

