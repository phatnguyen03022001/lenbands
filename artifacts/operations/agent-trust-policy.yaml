  candidate_declaration_contract_owner: change_governance
  repository_tree_may_not_self_authorize: true
  repository_tree_may_not_self_claim_ci_passed: true

host_controls:
  observed_state_source: artifacts/operations/hosting-control-state.yaml
  enforcement_claim_requires_live_host_evidence: true
  desired_controls:
    required_status_check: LenBands Toolchain Trust / verify-trust-boundary
    block_force_push: true
    block_branch_deletion: true
    dismiss_stale_approvals_when_reviews_are_used: true
    require_conversation_resolution_when_reviews_are_used: true
  current_policy_rule: desired_host_controls_are_not_claimed_as_enforced_until_observed_live