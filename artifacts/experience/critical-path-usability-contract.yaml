schema_version: 1.2.0
status: review
source_of_truth: true
contract_id: critical-path-usability
owner: experience + engineering
purpose: define accessibility navigation browser-security and browser-network recovery semantics for the P0 learner critical path

scope:
  p0_families: [P0-01, P0-02, P0-03, P0-04, P0-05]
  critical_surfaces: [auth_and_consent, reauthentication, placement, today_plan, writing_editor, evaluation_feedback, error_fix_retest, review_queue]

accessibility:
  baseline: WCAG_AA_oriented_product_contract_without_claiming_external_certification
  requirements:
    keyboard:
      - every_interactive_control_is_reachable_and_operable_without_pointer
      - focus_order_follows_visual_and_semantic_order
      - no_keyboard_trap_except_intentional_modal_with_escape_or_close_path
    focus:
      - visible_focus_indicator_is_never_removed_without_equivalent_replacement
      - route_state_and_validation_changes_move_or_restore_focus_predictably
      - async_evaluation_completion_does_not_steal_focus_without_user_action
    semantics:
      - headings_landmarks_labels_and_control_names_are_programmatic
      - icon_only_actions_have_accessible_names
      - status_and_error_messages_are_associated_with_the_affected_control_or_region
    screen_reader:
      - save_submit_processing_delayed_unavailable_and_result_validity_changes_have_non_visual_status_semantics
      - criterion_feedback_and_evidence_references_have_readable_structure_not_visual_position_only
    zoom_reflow:
      - p0_critical_path_remains_operable_at_200_percent_zoom
      - horizontal_scroll_is_not_required_for_ordinary_text_or_form_completion_except_intrinsically_wide_content
    visual:
      - color_is_not_the_only_carrier_of_error_validity_or_progress_meaning
      - text_and_critical_controls_preserve_readability_under_user_contrast_preferences_where_platform_supports_it
    motion:
      - reduced_motion_preference_disables_nonessential_motion
      - celebration_or_progress_animation_never_blocks_the_next_action
    editor:
      - writing_text_entry_works_with_standard_keyboard_editing_and_assistive_technology
      - word_count_timer_save_state_and_validation_are_available_without_hover_or_color_only_cues
    timed_flow:
      - timer_updates_do_not_generate_excessive_live_region_noise
      - time_pressure_never_removes_a_recovery_or_submit_confirmation_path_required_by_the_assessment_policy
  release_evidence:
    - keyboard_only_walkthrough
    - screen_reader_semantic_walkthrough
    - focus_and_error_announcement_check
    - 200_percent_zoom_and_reflow_check
    - reduced_motion_check

navigation:
  shell:
    default_authenticated_destination: today
    primary_destination_rule: today_resolves_the_next_learning_decision
    secondary_destinations: [progress_history, account]
    phase_gated_destinations: [library_explore]
    contextual_destinations: [placement, active_task, evaluation_status, feedback, error_fix, review, retest, mock_exam_when_activated]
    rule: capability_inventory_must_not_become_top_level_navigation_inventory
  primary_action:
    required_visible_elements: [one_primary_action, one_reason, one_verification_rule]
    maximum_competing_lighter_alternatives: 1
    rule: internal_candidate_count_is_not_learner_choice_count
  back_and_exit:
    browser_or_system_back_is_semantic_no_op_for_domain_truth: true
    leaving_resumable_session_does_not_imply_completion_or_abandonment: true
    leave_warning_only_when_unacknowledged_work_has_real_loss_risk: true
  resume:
    today_exposes_resume_when_active_session_is_valid: true
    refresh_restores_acknowledged_canonical_state: true
    cross_device_resume_when_activated_uses_versioned_server_state: true
    expired_auth_requires_reauthentication_before_resume: true
    reauthentication_reruns_current_authorization_and_resource_state: true
    reauthentication_does_not_replay_prior_mutation_automatically: true
  deep_link:
    authorize_before_render: true
    resolve_current_resource_version_and_eligibility: true
    stale_action_must_not_execute_superseded_plan: true
    missing_or_ineligible_resource_returns_one_useful_recovery_action: true
  submission_integrity:
    accepted_submission_cannot_return_to_editable_pre_submit_state_via_navigation: true
    navigation_refresh_or_reauthentication_cannot_duplicate_submission_evaluation_charge_evidence_or_completion: true
  dialog_policy:
    allowed_primary_uses: [consent, bounded_confirmation, recent_auth_challenge, destructive_decision]
    nested_primary_workflow_dialogs: prohibited
  release_evidence:
    - authenticated_shell_today_entry_walkthrough
    - back_from_each_p0_contextual_flow
    - resume_after_leaving_active_session
    - refresh_after_each_acknowledged_p0_mutation
    - reauthentication_during_writing_draft_and_active_session
    - reauthentication_after_accepted_submission
    - deep_link_owned_resource_authorization_and_state_resolution
    - stale_daily_action_link_replacement
    - unsaved_writing_navigation_preservation_or_real_loss_warning
    - accepted_submission_back_navigation_integrity
    - mobile_and_desktop_destination_hierarchy_consistency

browser_security:
  credential_handling:
    application_controlled_persistent_raw_bearer_storage: prohibited
    credentials_in_url_logs_analytics_or_cache_keys: prohibited
    expired_or_revoked_session_must_fail_closed: true
  request_integrity:
    cookie_authenticated_mutations_require_selected_origin_or_csrf_defense: true
    cors_alone_is_not_csrf_defense: true
    recent_auth_for_sensitive_operation_is_server_or_provider_verified: true
  rendering:
    learner_colab_provider_and_generated_text_are_untrusted: true
    raw_html_default: prohibited
    markdown_or_rich_text_requires_reviewed_sanitized_renderer: true
    unsafe_script_capable_url_schemes: prohibited
    content_security_policy_required_for_release: true
  payload_limits:
    canonical_policy: artifacts/engineering/api/type-system.yaml
    oversized_or_overdeep_input_rejected_before_side_effect: true
    silent_truncation_that_changes_learning_or_assessment_semantics: prohibited
  release_evidence:
    - credential_storage_and_leakage_inspection
    - cookie_csrf_or_origin_negative_cases_when_cookie_auth_is_used
    - expired_and_revoked_session_mutation_denial
    - recent_auth_negative_and_positive_cases_for_sensitive_privacy_action
    - stored_xss_and_unsafe_url_rendering_cases
    - content_security_policy_smoke_check
    - oversized_deep_payload_rejection_plus_legitimate_ielts_sized_control

browser_network:
  support_policy:
    rule: supported_browser_families_and_minimum_versions_are_a_release_configuration_not_an_architecture_fact
    p0_design_target: modern_standards_based_desktop_and_mobile_browsers_used_by_the_closed_pilot
  source_of_truth:
    rule: browser_local_storage_or_memory_is_never_the_only_canonical_copy_after_server_acknowledgement
  draft_and_attempt_preservation:
    writing_draft: preserve_local_work_during_transient_network_or_auth_interruption_when browser storage is available then versioned sync after authorization
    placement_and_practice: accepted_server_answers_are_idempotent; unacknowledged_local_input_is_preserved_when_feasible_and_never_presented_as_server_saved
    study_session: retry_state_transition_with_same_semantic_intent_and_version_guard
  degradation:
    transient_offline: allow_safe_local_continuation_only_for_flows_whose_evidence_integrity_is_not_changed_by_offline_work
    provider_outage: preserve_submission_and_show_delayed_or_unavailable_state
    browser_refresh_or_tab_suspend: restore_from_canonical_server_state_plus_safe_local_unacknowledged_draft_when_present
    auth_expiry: preserve_work_show_auth_required_and_resume_only_after_fresh_authorization_without_replaying_mutations
    storage_eviction: never_convert_missing_local_cache_into_deleted_server_work
    duplicate_submit: idempotency_prevents_duplicate_submission_evaluation_charge_or_completion
  integrity:
    - learn_mode_local_recovery_may_restore_scaffolding
    - retest_or_exam_like_mode_restore_must_follow_exposure_and_evidence_validity_policy
    - no_offline_or_reauth_behavior_may_fabricate_a_server_timestamp_score_or_completed_state
  release_evidence:
    - refresh_during_each_p0_mutation_flow
    - transient_network_timeout_and_reconnect
    - auth_expiry_and_reauthentication_during_resumable_flow
    - duplicate_submit_or_retry
    - browser_tab_suspend_resume_where_relevant
    - local_storage_unavailable_or_evicted_fallback
    - supported_browser_smoke_matrix

agent_rules:
  - accessibility_is_part_of_component_and_state_design_not_a_post_build_theme
  - navigation_is_part_of_state_correctness_not_cosmetic_routing
  - browser_security_is_part_of_the_critical_path_not_post_release_hardening
  - today_remains_the_default_next_decision_surface_unless_a_phase_specific_contract_explicitly_changes_it
  - do_not_add_top_level_navigation_for_capability_domains_without_measured_repeated_direct_entry_value
  - do_not_add_custom_keyboard_behavior_when_native_semantics_are_sufficient
  - do_not_render_untrusted_html_or_script_capable_urls_without_the_canonical_reviewed_boundary
  - do_not_claim_offline_support_beyond_the_specific_preservation_behavior_defined_here
  - do_not_use_browser_or_device_fingerprinting_as_a_hidden_learning_or_abuse_authority
