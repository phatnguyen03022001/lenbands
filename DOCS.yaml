agent_rules:
  - Never resolve authority by newest-looking filename.
  - Never treat README, catalog, index, generated projection, prompt, benchmark proposal, research synthesis, or compatibility pointer as a higher authority than its registered owner.
  - Do not scan the whole repository before consulting this registry.
  - Follow legacy aliases only for migration and traceability, never to select a second source of truth.
  - Stable product identities are capability IDs, framework node IDs, document_ids, operationIds, implementation family IDs and canonical decision-unit IDs; paths are replaceable.
  - Generated resolved OpenAPI is a deterministic build projection and never a semantic SSOT.
  - Execution policy is a decision projection and never a capability, rubric, domain-fact, API or state-machine SSOT.
  - Repository policy is not evidence of external GitHub enforcement; use hosting_control_state for observed host controls.
  - Candidate declarations describe a candidate but cannot authorize or verify themselves; use change_governance for the proof boundary.
  - If two canonical entries appear to own the same semantic field, stop and report authority_collision.
