legacy_aliases: {}

agent_rules:
  - Never resolve authority by newest-looking filename.
  - Never treat README, catalog, index, generated projection, prompt, benchmark proposal, research synthesis, or historical Git path as a higher authority than its registered owner.
  - Do not scan the whole repository before consulting this registry.
  - Before implementation planning, inspect problem_risk_coverage for the target capability family and do not infer that an unlisted control is solved.
  - Git history is the archive for retired migration/proposal/review material; do not restore a historical path as a compatibility pointer without a new canonical decision and executable consumer.
  - Stable product identities are capability IDs, framework node IDs, document_ids, operationIds and implementation family IDs; paths are replaceable.
  - Generated resolved OpenAPI is a deterministic build projection and never a semantic SSOT.
  - Repository policy is not evidence of external GitHub enforcement; use hosting_control_state for observed host controls.
  - Candidate declarations describe a candidate but cannot authorize or verify themselves; use change_governance for proof and trust_policy for runtime authorization requirements.
  - If two canonical entries appear to own the same semantic field, stop and report authority_collision.
