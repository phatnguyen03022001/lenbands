schema_version: 1.7.0
repository: phatnguyen03022001/lenbands
purpose: agent-readable document control plane
rule: Read this registry before opening deep documents. A path not registered as canonical must not override a canonical document.

reading_order:
  - DOCS.yaml
  - task_specific_authority_from_this_registry
  - problem_risk_coverage_for_target_family_when_implementation_related
  - referenced_contracts_only

