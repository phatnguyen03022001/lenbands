    retrieval_state: referenced_only
    default_context_visibility: false
    owns: []
    derives_from:
      - canonical capability meanings
      - exact decision_units declared by canonical domain-owner metadata
    rule: This projection selects the lowest sufficient compute mode but cannot create capabilities, decision units, canonical facts, rubric semantics or transport schemas.

